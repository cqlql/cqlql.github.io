[project]
name = "notes-rag"
version = "0.1.0"
description = "个人笔记站的语义问答：RAG 全链路实践"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_rag"]
