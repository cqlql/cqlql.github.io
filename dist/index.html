<script type="application/json" id="cards-data">[{"id":"rag-01","title":"为什么需要 RAG","stage":"rag","week":"1","file":"cards/01-rag/01-为什么需要RAG.md","filled":true,"hasNumbers":true,"short":"\u003cp>模型有三个绕不过去的问题：知识停在训练截止时间、看不到你的私有数据、不知道的时候会编得很像真的。\u003c/p>\n\u003cp>RAG 就是在回答前先做一次检索——把相关资料捞出来塞进 prompt，让模型基于资料回答，而不是凭记忆。\u003c/p>\n\u003cp>好处是三个：不用重训模型就能更新知识、答案能给出出处、模型没见过的私有数据也能用。\u003c/p>\n\u003cp>代价是\u003cstrong>检索质量决定上限\u003c/strong>：检索没捞到，生成再好也是编。\u003c/p>","expand":"\u003cp>\u003cstrong>三条路的取舍\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>方案\u003c/th>\u003cth>解决什么\u003c/th>\u003cth>代价\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>微调\u003c/td>\u003ctd>风格、格式、领域语言习惯\u003c/td>\u003ctd>知识更新要重训；成本高；照样会编\u003c/td>\u003c/tr>\u003ctr>\u003ctd>长上下文硬塞\u003c/td>\u003ctd>文档不多时最省事\u003c/td>\u003ctd>贵（按 token 计费，线性涨）；文档多了塞不下；中间内容容易丢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG\u003c/td>\u003ctd>事实类知识、会变的知识、私有数据\u003c/td>\u003ctd>多一套检索系统；检索错了就全错\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>判断标准很简单：\u003cstrong>知识会不会变\u003c/strong>。会变（产品文档、内部制度、别人的代码）→ RAG；不会变但要求说话像行内人 → 微调。两者不冲突，可以叠加。\u003c/p>\n\u003cp>\u003cstrong>RAG 的真实瓶颈在检索，不在生成\u003c/strong>\u003c/p>\n\u003cp>新手容易把精力放在 prompt 上，但实际项目里 80% 的问题出在检索：\u003c/p>\n\u003cul>\u003cli>切分把答案切断了 → 命中了但内容不全\u003c/li>\u003cli>用户问法和文档写法差太远 → 向量相似度上不去\u003c/li>\u003cli>型号、人名这类精确词被向量「抹平」→ 需要 BM25 补\u003c/li>\u003c/ul>\n\u003cp>所以做 RAG 的第一件事不是调 prompt，是\u003cstrong>建评估集量一下 recall\u003c/strong>。没有数字，所有优化都是猜。\u003c/p>\n\u003cp>\u003cstrong>「长上下文能塞 100 万 token 了，还要 RAG 吗」\u003c/strong>\u003c/p>\n\u003cp>要，但理由变了。不再是「塞不下」，而是：\u003c/p>\n\u003col>\u003cli>成本和延迟——每次问答都过一遍全量文档，贵且慢\u003c/li>\u003cli>lost in the middle——长上下文中间部分召回率明显下降，塞进去不等于用上了\u003c/li>\u003cli>可溯源——RAG 能给出处，长上下文塞进去说不清哪句来自哪\u003c/li>\u003c/ol>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不直接把文档全塞进 prompt？\u003cbr>\u003cstrong>A\u003c/strong>：三个原因。成本按 token 线性涨，一次问答可能几毛钱；长上下文有 lost in the middle 问题，中间部分容易被忽略；文档一多根本塞不下。RAG 是「按需取一小块」，成本和准确率都可控。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：RAG 和微调怎么选？\u003cbr>\u003cstrong>A\u003c/strong>：看知识会不会变。产品文档、内部规范这类天天变的用 RAG，改完立刻生效；要模型说话像某个领域的行家、或输出固定格式，用微调。两者可以叠加——微调管风格，RAG 管事实。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：RAG 最容易出问题的地方在哪？\u003cbr>\u003cstrong>A\u003c/strong>：检索。检索没召回，生成模型只能编，而且编得很自信。所以我先建了 50 条评估集量 recall@5，而不是先调 prompt——prompt 调得再好，喂错资料也救不回来。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你怎么评估 RAG 的效果？\u003cbr>\u003cstrong>A\u003c/strong>：分两层。检索层看 recall@5，回答层看准确率和幻觉率。检索层的数字能定位问题——recall 高但答案错，是生成的问题；recall 低，是切分或检索的问题。混在一起看就分不清该改哪。\u003c/li>\u003c/ul>","questions":["为什么不直接把文档全塞进 prompt？","RAG 和微调怎么选？","RAG 最容易出问题的地方在哪？","你怎么评估 RAG 的效果？"]},{"id":"rag-02","title":"chunk size 和 overlap 怎么定","stage":"rag","week":"1","file":"cards/01-rag/02-切分策略.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>size 管「一块装多少信息」，overlap 管「切断处别丢上下文」\u003c/li>\u003cli>我的依据：语料是 md 笔记，按 \u003ccode>##\u003c/code> 标题切 = 作者给的语义边界，超长块再二次切\u003c/li>\u003cli>太碎 → 答案被切成两半，命中但内容不全\u003c/li>\u003cli>太大 → 一块混多个主题，向量被稀释，相似度上不去\u003c/li>\u003cli>overlap 只解决边界问题，不是越大越好\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>四种切法，各自适合什么语料\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>切法\u003c/th>\u003cth>适合\u003c/th>\u003cth>坏在哪\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>固定长度（字符/token）\u003c/td>\u003ctd>无结构文本：日志、聊天记录、OCR 出来的纯文本\u003c/td>\u003ctd>会在句子中间切断，语义不完整\u003c/td>\u003c/tr>\u003ctr>\u003ctd>按段落 / 空行\u003c/td>\u003ctd>段落边界清晰的文档\u003c/td>\u003ctd>段落长度方差极大，有的 20 字有的一屏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>按标题层级\u003c/td>\u003ctd>md 的 \u003ccode>##\u003c/code>、HTML 的 \u003ccode>h2/h3\u003c/code>、Confluence 页面树\u003c/td>\u003ctd>标题下面可能很长，仍需二次切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>父子块（small-to-big）\u003c/td>\u003ctd>检索粒度和阅读粒度不一致时\u003c/td>\u003ctd>实现复杂，父块太长会吃 token\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>父子块解决的是「粒度冲突」\u003c/strong>：小块建索引，向量只承载一个意思，检索准；命中后不返回小块，而是按 \u003ccode>parent_id\u003c/code> 取回父块，喂给模型的内容完整。两件事分开调——检索要小，阅读要大。\u003c/p>\n\u003cp>\u003cstrong>语义切分 vs 字符切分\u003c/strong>：语义切分算相邻句子的向量相似度，跌破阈值才切，边界更贴合语义；代价是入库前要先算一遍 embedding（慢）、块数不可控、短文本上噪声大。字符切分快、可预测、可复现，工程上默认选它。\u003cstrong>先上字符切分，切不动了再考虑语义。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>overlap 的作用被高估了\u003c/strong>。它只解决一种情况：一句话正好横跨切点。代价是索引冗余（体积 +10%，检索时同一段内容在多个块里出现，会挤占 top-k 名额）。所以别指望靠调大 overlap 补语义完整性——那是父子块的活。\u003c/p>\n\u003cp>\u003cstrong>为什么按标题切在这个项目里是对的\u003c/strong>：笔记站是 md，\u003ccode>##\u003c/code> 就是作者亲手划的主题边界，比任何算法猜得都准。注意 \u003ccode>###\u003c/code> 层级的块要合并进上级 \u003ccode>##\u003c/code>，否则「原因」和「解法」会被切开，命中一个答不完整。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：overlap 为什么要设成 size 的 10% 左右？设 0 会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：10% 是经验起点不是定理，它约等于 1~2 句话，刚好接住跨边界的句子。设 0 时，横跨切点的答案会前半句在 A 块、后半句在 B 块，检索命中 A 块但喂给模型的是断句。代价只是索引体积涨 10%。别背 10% 这个数，要说「我用 0 / 10% / 20% 在同一批 query 上比过」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：什么时候该用「按标题层级切」而不是固定长度？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：语料本身有稳定结构时——md 的 \u003ccode>##\u003c/code>、HTML 的标题、Confluence 的页面树。因为标题就是作者给的语义边界。反例：纯文本、OCR 的 PDF、聊天记录，没有可靠标题，只能退回固定长度。判断标准一句话：\u003cstrong>标题是否由人来划\u003c/strong>。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：父子块具体怎么实现？检索命中的是子块，喂给模型的是父块，那引用出处怎么写？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：入库时子块存 \u003ccode>parent_id\u003c/code>；命中子块 → 按 id 取父块文本喂模型。出处记在子块上（子块有标题路径 + 字符偏移），引用时回填父块标题 + 子块位置。坑：父块要设上限（如 2000 字），超了就用「父块摘要 + 命中子块」的组合，否则 token 爆掉。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：切太碎会出现什么具体问题？举一个你遇到的例子。\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：要举真实例子。典型形态是 \u003ccode>### 原因\u003c/code> 和 \u003ccode>### 解决\u003c/code> 被切成两块，top-1 命中「原因」块，模型只看到原因没看到解法，答成「可能是 X 导致的」——明明资料里有答案。修法：\u003ccode>###\u003c/code> 合并到上级 \u003ccode>##\u003c/code>，或上父子块。\u003c/li>\u003c/ul>","questions":["overlap 为什么要设成 size 的 10% 左右？设 0 会怎样？","什么时候该用「按标题层级切」而不是固定长度？","父子块具体怎么实现？检索命中的是子块，喂给模型的是父块，那引用出处怎么写？","切太碎会出现什么具体问题？举一个你遇到的例子。"]},{"id":"rag-03","title":"embedding 模型怎么选","stage":"rag","week":"1","file":"cards/01-rag/03-Embedding选型.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>六个维度：语言、最大输入长度、维度、query 侧要不要 instruction、成本、数据能不能出网\u003c/li>\u003cli>我选 bge-m3：中文 + 数据不出网 + 8192 长文本，一个模型同时出 dense 和 sparse\u003c/li>\u003cli>换模型 = 全量重建索引，向量空间不兼容\u003c/li>\u003cli>上线后想换，得双写 + 影子流量过渡\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>主流候选的取舍\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>模型\u003c/th>\u003cth>维度\u003c/th>\u003cth>输入长度\u003c/th>\u003cth>适合\u003c/th>\u003cth>代价\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>bge-m3\u003c/td>\u003ctd>1024\u003c/td>\u003ctd>8192\u003c/td>\u003ctd>中文/多语言、要本地、要长文本\u003c/td>\u003ctd>显存 ~2.2G，比小模型慢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bge-large-zh-v1.5\u003c/td>\u003ctd>1024\u003c/td>\u003ctd>512\u003c/td>\u003ctd>纯中文短文本，追求速度\u003c/td>\u003ctd>长文档会被截断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>text-embedding-3-small\u003c/td>\u003ctd>1536（可裁）\u003c/td>\u003ctd>8191\u003c/td>\u003ctd>原型阶段、省事、便宜\u003c/td>\u003ctd>数据出网，按量计费\u003c/td>\u003c/tr>\u003ctr>\u003ctd>text-embedding-3-large\u003c/td>\u003ctd>3072（可裁）\u003c/td>\u003ctd>8191\u003c/td>\u003ctd>效果优先\u003c/td>\u003ctd>更贵，存储翻倍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>bge-m3 真正的优势不是「效果好」，是「一个模型出三种表示」\u003c/strong>：dense（语义）+ sparse（词权重，可直接当 BM25 的替代）+ colbert（多向量，细粒度匹配）。意味着混合检索的两路可以共用一个部署，不用再单独搭一套 BM25 服务。\u003c/p>\n\u003cp>\u003cstrong>query 侧 instruction 是最容易踩的坑\u003c/strong>。bge 系列训练时 query 前面带了指令（「为这个句子生成表示以用于检索相关文章：」），document 侧不带。推理时不还原这个形态，会掉几个点，而且掉得不明显——你不测就发现不了。判断方法：看模型卡有没有写，别猜。\u003c/p>\n\u003cp>\u003cstrong>换模型的代价是「向量空间不兼容」\u003c/strong>：不同模型输出的向量不在同一个空间里，距离没有可比性，旧索引直接作废。所以要全量重算 + 重建。工程上提前做两件事：索引里存 \u003ccode>embedding_model\u003c/code> 版本字段；把向量化封装成一个接口，换模型只改一处。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：query 和 document 为什么要区别处理？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：这是非对称检索——query 是短问句，document 是长段落，两者分布不同。模型训练时就是按「query + instruction」配「document」学的，推理时要还原这个形态，否则输入分布偏移。验证方法：同一批 query 加/不加 instruction 各跑一次 recall，差多少一目了然。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：向量要不要归一化？不归一化会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：归一化到单位长度后，余弦相似度就等于内积，可以省一次计算、也能直接用内积索引。不归一化时模长会污染排序——长文本的向量模往往更大，导致「长块天然排前面」。pgvector 的 cosine 算子 \u003ccode>&lt;=&gt;\u003c/code> 内部会归一化，但自己写内积就要手动做。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：什么时候必须用本地模型，不能用 API？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：四种情况——数据不能出网（内部制度、代码、医疗金融）；量大到 API 成本受不了（百万块 × 每次全量重建）；要求低延迟（本地 GPU 几 ms vs 网络往返）；要离线/内网部署。反过来，量小、原型期、只追效果上限，用 API 更省事。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：已经上线跑了一年，想换更好的 embedding 模型，要付出什么代价？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：全量重算 + 重建索引，且不能新旧混用（距离不可比）。做法：索引带模型版本字段 → 新旧索引并行双写 → 用 eval 集验证新的更好 → 影子流量/灰度切换。成本主要是重算的 GPU 时间和重建索引的窗口期，不是钱。\u003c/li>\u003c/ul>","questions":["query 和 document 为什么要区别处理？","向量要不要归一化？不归一化会怎样？","什么时候必须用本地模型，不能用 API？","已经上线跑了一年，想换更好的 embedding 模型，要付出什么代价？"]},{"id":"rag-04","title":"向量检索怎么调（相似度 / top-k / HNSW 与 IVFFlat）","stage":"rag","week":"1","file":"cards/01-rag/04-向量检索.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>top-k 由两头夹出来：后面有 rerank，k 就等于 rerank 池子；没有，就受 token 预算\u003c/li>\u003cli>HNSW：图结构，查询快、召回高，建得慢、吃内存，但支持增量写\u003c/li>\u003cli>IVFFlat：聚类，建得快、省内存，召回看数据分布，必须先有数据才能建\u003c/li>\u003cli>我这个量级（5000 块）精确检索就够，上 ANN 是为了把生产路径走通\u003c/li>\u003cli>参数调优看拐点不看最大值\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>三种相似度\u003c/strong>：余弦 = 内积 / (模长乘积)。向量归一化到单位长度后，余弦和内积排序完全等价；欧氏距离在归一化后也单调相关（L2² = 2 − 2cos）。所以「用哪个」在归一化之后不是精度问题，是实现成本问题。\u003c/p>\n\u003cp>\u003cstrong>为什么需要 ANN\u003c/strong>：精确检索是 O(n·d)，5000 块没问题，百万级 × 1024 维就是每次查询几百 ms 到秒级。ANN 用一点召回率换数量级的延迟下降。\u003c/p>\n\u003cp>\u003cstrong>HNSW（图）\u003c/strong>\u003c/p>\n\u003cul>\u003cli>多层图：上层稀疏做长跳，下层稠密做精搜，查询时从顶层往下贪心走\u003c/li>\u003cli>三个参数：\u003ccode>m\u003c/code>（每层连接数，默认 16）、\u003ccode>ef_construction\u003c/code>（建图时候选集，默认 64）、\u003ccode>ef_search\u003c/code>（查询时候选集）\u003c/li>\u003cli>建得慢（要反复插边、维护邻居）、吃内存（图结构常驻）；查询快、召回高\u003c/li>\u003cli>\u003cstrong>支持增量插入\u003c/strong>，这对「笔记天天更新」的场景很关键\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>IVFFlat（聚类）\u003c/strong>\u003c/p>\n\u003cul>\u003cli>k-means 把向量聚成 \u003ccode>nlist\u003c/code> 个簇，查询时只扫最近的 \u003ccode>nprobes\u003c/code> 个簇\u003c/li>\u003cli>建得快、省内存；\u003ccode>lists\u003c/code> 经验值是 \u003ccode>rows/1000\u003c/code>（或 \u003ccode>sqrt(rows)\u003c/code>）\u003c/li>\u003cli>\u003cstrong>必须先有数据才能建\u003c/strong>（聚类要样本），数据分布变了要重建；\u003ccode>nprobes\u003c/code> 越大越准越慢\u003c/li>\u003cli>增量写入后新向量可能落在错误的簇，召回慢慢劣化\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>pgvector 实操要点\u003c/strong>\u003c/p>\n\u003cp>```sql -- HNSW CREATE INDEX ON chunks USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64); SET hnsw.ef_search = 100;   -- 查询时调，越大越准越慢\u003c/p>\n\u003cp>-- IVFFlat（先灌数据，再建索引） CREATE INDEX ON chunks USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100); SET ivfflat.probes = 10; ```\u003c/p>\n\u003cp>\u003cstrong>top-k 的正确推法\u003c/strong>：不是「试到好为止」，而是两头夹——上限是 token 预算（5 块 × 500 字 ≈ 2500 token 可接受），下限是 rerank 的池子大小（池子外的东西 rerank 捞不回来）。有 rerank 时 k 取 20；没 rerank 时 k 取 5。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你的数据量多大？这个量级需要上 ANN 吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：诚实答。5000 块 / 1024 维，精确检索 10ms 级，\u003cstrong>不需要\u003c/strong> ANN。上 pgvector 的 HNSW 是为了把生产路径走通（真实业务是百万级），并且拿到建索引耗时和召回曲线这组数字。这种「我知道我的量级不需要，但我测过」比硬吹有说服力。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：HNSW 的 ef_search 调大，代价是什么？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：查询时候选集变大 → 图遍历步数变多 → 延迟近似线性上升、内存带宽压力上升。召回收益递减：40→100 提升明显，100→200 提升很小。所以选\u003cstrong>拐点\u003c/strong>（比如 100）而不是最大值。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：余弦相似度和内积什么时候可以互换？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：向量都归一化到单位长度时等价。实际影响：归一化后能用内积索引（省一次归一化，略快）；不归一化时内积偏好大模长向量，排序会偏。纪律是「要么全归一化，要么统一用 cosine 算子」，别混着用。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：top-k 取 5 还是 20？为什么不是 50？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：看下游。接 rerank 就取 20（等于池子大小，池子外的捞不回来）；直接喂模型就取 5（受 token 预算约束）。50 的问题是噪声多、贵，而且模型对长上下文中间部分注意力弱（lost in the middle），塞进去不等于用上。正确做法：测 recall@k 曲线，看 k 到多少饱和。\u003c/li>\u003c/ul>","questions":["你的数据量多大？这个量级需要上 ANN 吗？","HNSW 的 ef_search 调大，代价是什么？","余弦相似度和内积什么时候可以互换？","top-k 取 5 还是 20？为什么不是 50？"]},{"id":"rag-05","title":"为什么要混合检索（BM25 + 向量）","stage":"rag","week":"1","file":"cards/01-rag/05-混合检索.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>向量漏精确词：型号、人名、错误码这类稀有 token 被语义压缩抹平\u003c/li>\u003cli>BM25 漏改写：只认词是否出现，同义表达零重叠就召不回\u003c/li>\u003cli>融合用 RRF：只看排名不看分数，免疫尺度差异\u003c/li>\u003cli>三组 recall@5 对比是我最能讲的一组数字\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>两路各自瞎在哪\u003c/strong>\u003c/p>\n\u003cul>\u003cli>稠密向量是语义压缩：稀有 token（\u003ccode>ERR_4032\u003c/code>、\u003ccode>XR-2000\u003c/code>、人名）在训练语料里出现少，学不到有区分度的表示，容易被压到「语义相近」的位置上。结果是「意思对了，具体那个词没对上」。\u003c/li>\u003cli>BM25 只看词频和逆文档频率：用户问「怎么让模型不胡说」，文档写「抑制幻觉」——零词重叠，BM25 完全召不回。它不懂同义、不懂改写、不懂上下文。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>融合的两种做法\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>做法\u003c/th>\u003cth>公式\u003c/th>\u003cth>优点\u003c/th>\u003cth>坑\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>分数加权\u003c/td>\u003ctd>\u003ccode>w₁·s_vec + w₂·s_bm25\u003c/code>\u003c/td>\u003ctd>能保留「分数强度」信息\u003c/td>\u003ctd>两种分数量纲不同（余弦 ∈ [−1,1]，BM25 无上界），必须先归一化；而归一化依赖当次候选集，不稳定，权重还得调\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RRF\u003c/td>\u003ctd>\u003ccode>Σ 1/(k + rank)\u003c/code>\u003c/td>\u003ctd>只用排名，免疫量纲；对单路失效鲁棒；一行代码\u003c/td>\u003ctd>丢掉分数强度（两路都极度确信 vs 勉强命中，看不出来）；k 要调\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>RRF 里 \u003ccode>k = 60\u003c/code> 的作用是\u003cstrong>压平头部差距\u003c/strong>：k 小的时候 rank 1 和 rank 2 的得分差很大（1/1 vs 1/2），一路稍微好一点就压倒性胜出；k 大时差距被拉平，两路更均衡地投票。60 是原论文的经验值。\u003c/p>\n\u003cp>\u003cstrong>混合反而变差的情况\u003c/strong>：语料里几乎没有专有名词（纯散文、小说、通用问答），BM25 那一路只是引入噪声；或者中文分词质量差，精确词被切碎，BM25 的精确匹配优势直接消失。\u003c/p>\n\u003cp>\u003cstrong>工程落地\u003c/strong>：pgvector 本身不带 BM25。常见做法是 pg 的 \u003ccode>tsvector\u003c/code> + 中文分词插件（\u003ccode>zhparser\u003c/code> / \u003ccode>pg_jieba\u003c/code>）做词法那一路，或者把 BM25 放到 ES/OpenSearch，应用层做 RRF 融合。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：RRF 为什么比分数加权更常用？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：三个原因——免疫量纲差异，不用归一化；对单路失效鲁棒（某一路排序很差时 \u003ccode>1/(k+rank)\u003c/code> 贡献小，不会带偏）；不用调权重。代价是丢了分数强度信息，且 k 需要调。工程上「少一个要调的参数」本身就是价值。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：混合检索之后，top-k 怎么分配？两路各取多少？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：融合前的 k 必须大于融合后的 k，否则融合没意义（各取 5 融成 5，等于没融合）。常见配置：两路各取 50 → RRF 融合 → 取 top-20 → 给 rerank。总量受 rerank 延迟约束。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：什么时候混合检索反而不如纯向量？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：语料无精确术语；中文分词质量差（没有领域词典，型号/产品名被切碎，IDF 失效）；query 都是自然语言长句（BM25 的长 query 权重被摊薄）。所以「上混合」之前先看语料里有没有值得精确匹配的词。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：中文 BM25 怎么分词？分词错了会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：中文没空格，必须分词。用 jieba（通用）或领域词典（型号、产品名、错误码必须进自定义词典，否则被切成常见词）。分错的后果：精确词的 IDF 失效，BM25 退化成「一堆常见词的词频统计」，精确匹配的优势全丢——这时候混合还不如纯向量。\u003c/li>\u003c/ul>","questions":["RRF 为什么比分数加权更常用？","混合检索之后，top-k 怎么分配？两路各取多少？","什么时候混合检索反而不如纯向量？","中文 BM25 怎么分词？分词错了会怎样？"]},{"id":"rag-06","title":"rerank 为什么有效、为什么只对 top-20 做","stage":"rag","week":"2","file":"cards/01-rag/06-Rerank.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>向量是 bi-encoder：两侧独立编码，doc 向量能离线算好，快但粗\u003c/li>\u003cli>rerank 是 cross-encoder：query 和 doc 拼一起过模型，有词级交互，准但每对都要算一次\u003c/li>\u003cli>所以两段式：向量粗排 top-20 → rerank 精排 top-5\u003c/li>\u003cli>池子大小是上限：recall@20 决定 rerank 的天花板\u003c/li>\u003cli>rerank 也会把对的排下去，必须用 eval 验证\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>结构差异决定了能力差异\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>bi-encoder（向量检索）\u003c/th>\u003cth>cross-encoder（rerank）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>输入\u003c/td>\u003ctd>query、doc 分别过 encoder\u003c/td>\u003ctd>\u003ccode>[query, doc]\u003c/code> 拼成一个序列\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交互\u003c/td>\u003ctd>无（只在最后用向量点积「碰」一下）\u003c/td>\u003ctd>全（注意力能在两侧 token 间自由流动）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>预计算\u003c/td>\u003ctd>doc 向量可离线算好、建索引\u003c/td>\u003ctd>不行，每对都要跑一次完整前向\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复杂度\u003c/td>\u003ctd>编码 O(1) + ANN 检索\u003c/td>\u003ctd>O(n) 次推理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>精度\u003c/td>\u003ctd>粗\u003c/td>\u003ctd>高\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>为什么准但不能全库用\u003c/strong>：cross-encoder 的精度来自词级交互，代价是「query 和 doc 必须一起进模型」，无法预计算。5000 块 × 20ms ≈ 100 秒一次查询，QPS 直接归零。所以它只能作用在一个小池子上。\u003c/p>\n\u003cp>\u003cstrong>两段式的分工\u003c/strong>：粗排负责「该有的在池子里」（看 recall@20），精排负责「排在前面的确实相关」（看 recall@5 / MRR）。两个指标分开看，才知道问题出在哪一层——recall@20 低是粗排的锅，recall@20 高但 recall@5 低才是 rerank 能救的。\u003c/p>\n\u003cp>\u003cstrong>top-20 的依据不是经验值，是天花板\u003c/strong>：rerank 只能从池子里挑，所以 \u003ccode>recall@5_after_rerank ≤ recall@20_before\u003c/code>。池子大小要先把 recall@k 曲线测出来，看 k 到多少接近饱和。\u003c/p>\n\u003cp>\u003cstrong>延迟账\u003c/strong>：20 对 × batch 8 × 每批 30ms ≈ 75ms，可接受。这是「20」这个数真正的约束来源——不是精度，是延迟预算。\u003c/p>\n\u003cp>\u003cstrong>别假设 rerank 一定更好\u003c/strong>：cross-encoder 也有偏差（偏好关键词密集、格式整齐的段落），会把原本排第一的正确块挤到第六。所以必须跑 eval，而且要同时看 recall@5 和 MRR。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不直接对所有文档做 rerank？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：成本是 O(n) 次 cross-encoder 前向，随文档数线性涨。5000 块就是 100 秒/次查询，QPS 撑不住。而且边际收益递减——排到 200 名之外的，不是「差点意思」，是「压根不对」。两段式的本质是\u003cstrong>用便宜的粗排把候选集缩到精排付得起的规模\u003c/strong>。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：top-20 这个数怎么定的？如果 recall@20 只有 0.6 呢？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：20 是被延迟预算夹出来的（约 75ms），不是精度最优。如果 recall@20 只有 0.6，说明\u003cstrong>粗排有问题，这时候调 rerank 是错的方向\u003c/strong>——该回去修切分、embedding 或混合检索。这也是分层看指标的意义：先保证 recall@20 够高，rerank 才有发挥空间。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：rerank 之后取 top-5，会不会把原来对的那条挤掉？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：会。cross-encoder 有自己的偏好，会把关键词密集的块排前面。所以不能假设 rerank 单调改善，必须用 eval 集验证。实践上同时看 recall@5 和 MRR——只看 recall@5 会漏掉「对的还在但排名掉了」这种情况。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：bge-reranker 的输入格式和 max length 有什么坑？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：输入是 \u003ccode>(query, passage)\u003c/code> 对，不是自己拼字符串；\u003ccode>max_length\u003c/code> 通常 512，超了会被截断——\u003cstrong>长 passage 的尾部信息直接丢失\u003c/strong>，这也是 chunk 不能太大的另一个理由。另外输出的分数是 logit 不是概率，同一模型内可比，跨模型别比。\u003c/li>\u003c/ul>","questions":["为什么不直接对所有文档做 rerank？","top-20 这个数怎么定的？如果 recall@20 只有 0.6 呢？","rerank 之后取 top-5，会不会把原来对的那条挤掉？","bge-reranker 的输入格式和 max length 有什么坑？"]},{"id":"rag-07","title":"recall@k、MRR、nDCG 分别衡量什么","stage":"rag","week":"2","file":"cards/01-rag/07-评估指标.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>recall@k 答「有没有捞到」，MRR 答「第一条对的排多前」，nDCG 答「多条相关的整体排序」\u003c/li>\u003cli>RAG 检索层首选 recall：后面还有 rerank 和模型兜底，先保证不遗漏\u003c/li>\u003cli>一个 query 一个答案用 MRR，多个相关文档用 nDCG\u003c/li>\u003cli>precision 在 RAG 里意义有限，捞多了 rerank 会筛\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>三个指标的定义与适用场景\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>指标\u003c/th>\u003cth>公式\u003c/th>\u003cth>回答什么\u003c/th>\u003cth>什么时候用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>recall@k\u003c/td>\u003ctd>`\u003c/td>\u003ctd>top-k ∩ 相关集\u003c/td>\u003ctd>/\u003c/td>\u003ctd>相关集\u003c/td>\u003ctd>`\u003c/td>\u003ctd>该捞的有没有捞到（不管排第几）\u003c/td>\u003ctd>RAG 检索层首选\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MRR\u003c/td>\u003ctd>\u003ccode>mean(1 / rank_first_relevant)\u003c/code>\u003c/td>\u003ctd>第一条对的排在第几\u003c/td>\u003ctd>「只要一条就对」：事实查询、问答\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nDCG@k\u003c/td>\u003ctd>\u003ccode>DCG@k / IDCG@k\u003c/code>，\u003ccode>DCG = Σ (2^rel−1)/log₂(i+1)\u003c/code>\u003c/td>\u003ctd>多条相关的整体排序质量（含分级 + 位置衰减）\u003c/td>\u003ctd>一个 query 对应多个相关文档，且相关性有强弱\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>为什么 RAG 优先看 recall\u003c/strong>：架构决定的。后面还有 rerank 和 LLM 两层过滤，多捞几条不相关的代价很小（几 ms + 一点 token）；漏掉的代价很大——模型只能编，或者答「资料里没有」。\u003cstrong>precision 在「检索结果直接给用户看」的场景才重要\u003c/strong>（搜索框、推荐），在 RAG 里不是。\u003c/p>\n\u003cp>\u003cstrong>MRR 和 nDCG 的分工\u003c/strong>：MRR 只看第一条，且假设相关是二值的；nDCG 看全部结果、支持 0/1/2/3 分级、有位置衰减。所以——「一个 query 只该命中一篇」用 MRR，「一个 query 该命中好几篇且重要程度不同」用 nDCG。只用 MRR 会把「其余几篇全排错」掩盖掉。\u003c/p>\n\u003cp>\u003cstrong>三个指标会互相打架\u003c/strong>：nDCG 高但 recall 低，意思是「把少数相关文档排得很漂亮，但漏了一半」。所以 RAG 里要 recall + nDCG 一起看，不能只看一个。\u003c/p>\n\u003cp>\u003cstrong>指标要说清口径\u003c/strong>：recall@5 的分母是「标注的相关文档总数」。标 3 篇、命中 2 篇 = 2/3；只标 1 篇就退化成 0 或 1（hit rate）。口径不说清，两个人算出来的数能差一倍。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么 RAG 更看 recall 而不是 precision？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：因为后面有 rerank 和 LLM 两层过滤。多捞几条不相关的，代价是几 ms 和一点 token；漏掉的代价是模型只能编。precision 在「检索结果直接呈现给用户」时才是主指标，RAG 里它是下游问题。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：MRR 和 nDCG 的区别是什么？什么时候必须用 nDCG？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：MRR 只看第一条、二值相关；nDCG 看全部、支持分级、有位置衰减。必须用 nDCG 的场景：一个 query 对应多个相关文档且强弱不同（比如「RAG 怎么做」命中 5 篇，2 篇核心 3 篇边缘）——只用 MRR 会掩盖「其余 4 篇全排错」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：一个 query 有多个正确文档时，recall@5 怎么算？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：分母是相关文档总数。标了 3 篇、top-5 命中 2 篇 → 2/3。只标 1 篇就退化成 0/1（hit rate）。所以\u003cstrong>标注时必须说清这个 query 的相关文档集合\u003c/strong>，否则不同人算出来的数不一样，跨版本也没法比。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：recall@5 从 0.6 提升到 0.8，业务上意味着什么？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：每 5 个问题里，「检索没捞到正确答案」的从 2 个降到 1 个。对 RAG 来说没捞到 ≈ 必然幻觉或答「资料里没有」。要换算成用户侧指标——答对率、追问率、转人工率。只报 recall 不换算，显得只会跑指标。\u003c/li>\u003c/ul>","questions":["为什么 RAG 更看 recall 而不是 precision？","MRR 和 nDCG 的区别是什么？什么时候必须用 nDCG？","一个 query 有多个正确文档时，recall@5 怎么算？","recall@5 从 0.6 提升到 0.8，业务上意味着什么？"]},{"id":"agent-01","title":"Function Calling 的完整交互流程","stage":"agent","week":"3","file":"cards/02-agent/01-FunctionCalling协议.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>最少两次请求：带 tools 请求 → 模型返回 tool_calls → 本地执行 → 回填 role=tool → 再请求\u003c/li>\u003cli>模型只产出「调哪个、参数是什么」的结构化意图，不执行\u003c/li>\u003cli>arguments 是 JSON 字符串要 parse；tool_call_id 必须一一对上\u003c/li>\u003cli>执行权在应用侧，这是安全边界\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>五步流程\u003c/strong>\u003c/p>\n\u003col>\u003cli>请求里带 \u003ccode>tools\u003c/code>：\u003ccode>[{type:\"function\", function:{name, description, parameters: &lt;JSON Schema&gt;}}]\u003c/code>\u003c/li>\u003cli>模型返回 \u003ccode>finish_reason: \"tool_calls\"\u003c/code>，\u003ccode>message.tool_calls\u003c/code> 是数组，每项形如\u003c/li>\u003c/ol>\n\u003cp>``\u003ccode>json {\"id\": \"call_abc\", \"type\": \"function\", \"function\": {\"name\": \"get_interview_record\", \"arguments\": \"{\\\"candidate_id\\\":\\\"c_01\\\"}\"}} \u003c/code>`\u003ccode> 注意 \u003c/code>arguments` 是\u003cstrong>字符串\u003c/strong>，不是对象\u003c/p>\n\u003col>\u003cli>你的代码 \u003ccode>JSON.parse(arguments)\u003c/code> → 校验 → 执行真实函数（鉴权、超时、幂等都要自己做）\u003c/li>\u003cli>回填一条 \u003ccode>{\"role\":\"tool\",\"tool_call_id\":\"call_abc\",\"content\":\"&lt;结果字符串&gt;\"}\u003c/code>，\u003cstrong>每个 id 一条，不能合并\u003c/strong>\u003c/li>\u003cli>再请求一次，模型基于结果继续：可能再调（继续循环），也可能给最终答案（\u003ccode>finish_reason: \"stop\"\u003c/code>）\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>核心认知\u003c/strong>：整个流程里模型只输出文本（一段 JSON），执行权在你手里。所以你可以拒绝执行、可以改参数、可以加人工审批。这是 Function Calling 比「让模型直接输出 SQL / shell」安全的根本原因——\u003cstrong>边界不在模型有多听话，在执行权归谁\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>两个必踩的坑\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>arguments\u003c/code> 是 JSON 字符串，直接当对象用会报错；而且模型可能产出非法 JSON（缺引号、多逗号），要 try/catch 兜住并把错误回给模型让它重发\u003c/li>\u003cli>\u003ccode>tool_call_id\u003c/code> 对不上：一次返回多个 \u003ccode>tool_calls\u003c/code> 时，模型靠 id 把结果和请求配对。少回一条、id 写错，轻则答错，重则 API 直接 400\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：模型真的执行了你的函数吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：没有。模型只输出结构化意图（函数名 + 参数 JSON），执行的是我的代码。所以危险动作（删数据、发消息、付款）必须在我这层做校验和确认。这也是它比「让模型直接生成 SQL」安全的地方——\u003cstrong>执行权在应用侧，不在模型侧\u003c/strong>。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：模型一次返回多个 tool_calls，你怎么处理？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：无依赖就并行执行，然后为每个 id 各回一条 \u003ccode>role=tool\u003c/code> 消息；\u003cstrong>必须全部回填\u003c/strong>，漏一个下次请求就报错。有依赖时（第二个参数来自第一个结果）不能并行，要让它分两轮。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：回填结果时为什么要带 tool_call_id？不带会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：一次可能返回多个调用，模型靠 id 把「结果」和「请求」配对。不带或对不上，模型不知道哪条结果对应哪个调用——轻则把结果安错地方，重则 API 直接 400（OpenAI 要求每个 \u003ccode>tool_calls\u003c/code> 都有对应响应）。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：tool_choice 有哪几种取值，什么时候用 required？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：\u003ccode>auto\u003c/code>（默认，模型自己决定）、\u003ccode>none\u003c/code>（禁止调，只要文本）、\u003ccode>required\u003c/code>（强制至少调一个）、指定函数（强制调这个）。\u003ccode>required\u003c/code> 用在「这一步必须拿到工具数据才能继续」的流程节点，防止模型偷懒直接编答案。\u003c/li>\u003c/ul>","questions":["模型真的执行了你的函数吗？","模型一次返回多个 tool_calls，你怎么处理？","回填结果时为什么要带 tool_call_id？不带会怎样？","tool_choice 有哪几种取值，什么时候用 required？"]},{"id":"agent-02","title":"工具描述怎么写模型才调得对","stage":"agent","week":"3","file":"cards/02-agent/02-工具描述设计.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>模型选工具只看 name + description，所以 description 就是给模型看的 API 文档\u003c/li>\u003cli>四样必写：什么时候用、什么时候不用、参数含义和取值、一个调用示例\u003c/li>\u003cli>相邻工具必须在描述里划清边界，否则模型按字面相似度随机选\u003c/li>\u003cli>关键约束放第一句，模型对长文本中间部分注意力弱\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>反例 → 正例\u003c/strong>\u003c/p>\n\u003cp>```jsonc // 反例：模型不知道查什么，要么不调，要么乱调 {\"name\": \"search\", \"description\": \"查询信息\"}\u003c/p>\n\u003cp>// 正例：触发条件 + 不适用场景 + 参数示例 {\"name\": \"get_interview_record\", \"description\": \"查询某位候选人\u003cstrong>已完成\u003c/strong>的面试记录。当用户问「上次面试怎么样」「面试表现如何」时使用。若用户问的是题库里的题目，用 list_questions，不要用本工具。\", \"parameters\": {\"type\": \"object\", \"properties\": { \"candidate_id\": {\"type\": \"string\", \"description\": \"候选人 ID，形如 c_01\"}, \"round\": {\"type\": \"integer\", \"enum\": [1, 2, 3], \"description\": \"第几轮面试；不传则返回全部轮次\"}}, \"required\": [\"candidate_id\"]}} ```\u003c/p>\n\u003cp>\u003cstrong>四条设计原则\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>原则\u003c/th>\u003cth>做法\u003c/th>\u003cth>不做的后果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>边界显式\u003c/td>\u003ctd>描述里写「X 用于…；Y 用于…，不要混用」\u003c/td>\u003ctd>两个相似工具被随机选\u003c/td>\u003c/tr>\u003ctr>\u003ctd>参数给例子\u003c/td>\u003ctd>枚举值 + 格式示例 + 单位，比给 \u003ccode>type\u003c/code> 重要\u003c/td>\u003ctd>模型传 \u003ccode>\"3月1日\"\u003c/code> 而不是 \u003ccode>2026-03-01\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>命名动宾结构\u003c/td>\u003ctd>\u003ccode>get_interview_record\u003c/code> / \u003ccode>score_answer\u003c/code>\u003c/td>\u003ctd>\u003ccode>interview\u003c/code>、\u003ccode>data\u003c/code> 这种泛词无法区分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>关键信息前置\u003c/td>\u003ctd>触发条件写第一句\u003c/td>\u003ctd>长描述里真正的约束被淹没\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>工具数量是隐藏成本\u003c/strong>：工具越多，描述之间互相干扰越严重，选错率上升、token 成本上升、延迟上升。超过 10~15 个就该考虑分组：先让模型选「领域」，再只挂该领域的工具子集（两阶段路由）。\u003c/p>\n\u003cp>\u003cstrong>description 不是越长越好\u003c/strong>：3~5 句能说清「何时用 / 何时不用 / 参数含义」就够。太长有两个副作用——每次请求都带全量工具定义（token 贵），且关键约束被稀释。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：举一个「改了一句话，模型就从乱调变正确」的具体例子。\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：必须真实。模板：原来写「查询面试信息」→ 用户问「题库里有没有这道题」时也调它 → 改成「查询\u003cstrong>候选人已完成\u003c/strong>的面试记录，用户问'上次面试怎么样'时用；题库用 list_questions」→ 选对率从 a/b 到 c/d。关键是讲清\u003cstrong>歧义在哪、怎么消除的\u003c/strong>，不是背结论。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：两个工具功能很像，怎么让模型选对？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：三招——描述里显式互斥（「如果…用 A，如果…用 B」）；参数上做区分（A 必填 \u003ccode>interview_id\u003c/code>，B 必填 \u003ccode>question_id\u003c/code>，模型看到不同必填项会多想一步）；实在分不清就合并成一个工具加 \u003ccode>mode\u003c/code> 参数（工程上最稳，模型只需选 mode）。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：工具数量多了（比如 20 个）会有什么问题？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：选错率上升（描述互相干扰）、token 成本上升、延迟上升。做法：工具分组 + 两阶段路由、按场景只挂当前需要的工具、把低频工具合并成「通用查询 + 参数」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：description 写多长合适？写太长有什么副作用？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：3~5 句，能覆盖「何时用 / 何时不用 / 参数含义」就停。副作用有两个：每次请求都带全量工具定义（token 按调用次数放大）；关键约束被长文本稀释（模型对中间内容注意力弱）。所以把触发条件放第一句。\u003c/li>\u003c/ul>","questions":["举一个「改了一句话，模型就从乱调变正确」的具体例子。","两个工具功能很像，怎么让模型选对？","工具数量多了（比如 20 个）会有什么问题？","description 写多长合适？写太长有什么副作用？"]},{"id":"agent-03","title":"ReAct 和一次性 Function Calling 的区别","stage":"agent","week":"3","file":"cards/02-agent/03-ReAct循环.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>一次性 FC：拿到工具结果就作答，只适合单步能解决的任务\u003c/li>\u003cli>ReAct：Thought → Action → Observation 循环，看结果再定下一步\u003c/li>\u003cli>Thought 是给模型的 scratchpad，让中间推理有依据，不是玄学\u003c/li>\u003cli>代价是每轮一次 LLM 调用，慢且贵，能一次解决就别上 ReAct\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>ReAct 论文的核心\u003c/strong>：交替生成推理轨迹（Thought）和动作（Action），Observation 是环境返回。关键在「交替」——模型不是一次猜完所有步骤，而是每步根据上一步的实际结果修正方向。\u003c/p>\n\u003cp>\u003cstrong>和 plan-and-execute 的对比\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>ReAct\u003c/th>\u003cth>plan-and-execute\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>节奏\u003c/td>\u003ctd>边做边看\u003c/td>\u003ctd>先出完整计划再执行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>优点\u003c/td>\u003ctd>能应对未知（下一步取决于结果）\u003c/td>\u003ctd>快（可并行）、可审查、可缓存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>缺点\u003c/td>\u003ctd>慢、贵、可能发散\u003c/td>\u003ctd>计划错了要整体重来\u003c/td>\u003c/tr>\u003ctr>\u003ctd>适合\u003c/td>\u003ctd>路径不固定\u003c/td>\u003ctd>步骤可枚举\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>实际最常用的是\u003cstrong>混合\u003c/strong>：外层 plan 定骨架，需要探索的那一步用 ReAct；plan 失效时回退重规划。\u003c/p>\n\u003cp>\u003cstrong>成本账\u003c/strong>：每轮一次 LLM 调用，且每次都带全量上下文。3 轮 ≈ 3 倍 token + 3 倍延迟。所以「能用一次性 FC 解决的绝不上 ReAct」——这不只是省钱，也减少出错面。\u003c/p>\n\u003cp>\u003cstrong>实现真相\u003c/strong>：现在大多数框架里的「ReAct」其实就是\u003cstrong>循环 Function Calling\u003c/strong>，区别只在有没有显式的 reasoning 字段：\u003c/p>\n\u003cul>\u003cli>reasoning 模型（o1 系、Claude 的 thinking）：thought 在 \u003ccode>reasoning_content\u003c/code> 里，不占用户可见上下文，且经过 RL 训练更可靠；但不可控、不可审计\u003c/li>\u003cli>普通模型：在 prompt 里要求先输出 \u003ccode>Thought: ...\u003c/code> 再输出 Action，thought 作为普通 assistant 文本进上下文（占 token、影响后续轮次）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>三种失效模式\u003c/strong>：Thought 越推越偏（自我强化错误前提）、重复同一个 Action（没有「试过了」的记忆）、提前终止（模型觉得「差不多了」就停）。这三种都要靠外部硬约束兜，不能指望模型自觉。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：Thought 那一步真的有用吗？去掉会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：看任务。多步任务、且下一步依赖中间结果时，Thought 让模型把「为什么这么调」写出来，等于给自己一块草稿纸，实测能减少重复调用和参数错误。去掉后模型倾向「一次猜完」，复杂任务准确率下降。反例：单步任务（查个天气）加 Thought 只是白烧 token。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：ReAct 和 plan-and-execute 怎么选？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：看\u003cstrong>路径是否可预知\u003c/strong>。步骤固定、可枚举 → plan（快、可审查、可缓存）；路径依赖中间结果（要先查 A 才知道查 B）→ ReAct。实践中最常用是混合：外层固定骨架，需要探索的那一步用 ReAct。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：ReAct 循环怎么终止？靠模型自己说结束可靠吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：不可靠，必须双保险。硬上限（最大轮次 / 总超时 / 成本上限）+ 模型自答（\u003ccode>finish_reason=stop\u003c/code>）。到硬上限时不要抛错，让模型基于已有信息给「尽力而为」的回答并说明缺什么。另外加重复检测：连续两轮相同 Action + 相同参数 → 强制终止或换提示。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你的实现里，Thought 是模型的 reasoning 字段还是拼在 prompt 里的？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：按实际实现答。reasoning 模型的 thought 在 \u003ccode>reasoning_content\u003c/code>，不进 messages、不占上下文；普通模型就在 prompt 里要求先输出 \u003ccode>Thought:\u003c/code>，作为 assistant 文本进上下文。区别很实际——拼在 prompt 里的 thought 会累积占 token 并影响后续轮次，reasoning 字段的不会（但要确认 API 是否回传）。\u003c/li>\u003c/ul>","questions":["Thought 那一步真的有用吗？去掉会怎样？","ReAct 和 plan-and-execute 怎么选？","ReAct 循环怎么终止？靠模型自己说结束可靠吗？","你的实现里，Thought 是模型的 reasoning 字段还是拼在 prompt 里的？"]},{"id":"agent-04","title":"多轮调用时上下文怎么管","stage":"agent","week":"4","file":"cards/02-agent/04-多轮工具调用.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>messages 是成对结构：assistant(tool_calls) ↔ tool(tool_call_id)，缺一半就报错\u003c/li>\u003cli>工具返回只给模型要用的字段，别整坨塞\u003c/li>\u003cli>长结果三招：截断加提示、先摘要、分页式让模型自己取\u003c/li>\u003cli>超限先删最早的完整轮次，保留 system，绝不单独删 tool 消息\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>三轮之后的 messages 长什么样\u003c/strong>\u003c/p>\n\u003cp>``\u003ccode> system user: 上次面试怎么样？ assistant(tool_calls: [A: get_interview_record, B: list_questions])   ← 一次返回两个 tool(tool_call_id=A): {\"rounds\":3,\"score\":82,...} tool(tool_call_id=B): {\"items\":[...]} assistant(tool_calls: [C: score_answer]) tool(tool_call_id=C): {\"score\":78,\"reason\":\"...\"} assistant: 你上次三轮面试，平均 80 分……                                ← 最终答案 \u003c/code>``\u003c/p>\n\u003cp>\u003cstrong>成对是硬约束\u003c/strong>：每个 \u003ccode>tool_calls\u003c/code> 的 id 必须有且只有一条对应的 \u003ccode>tool\u003c/code> 消息。裁剪时必须整对删（assistant + 它所有的 tool 消息），否则 API 报 \u003ccode>messages with role 'tool' must be a response to a preceding message with 'tool_calls'\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>工具结果瘦身\u003c/strong>（最容易被忽略的省钱手段）\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>原始返回\u003c/th>\u003cth>给模型的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>整条 DB 记录（含创建时间、软删标记、内部字段）\u003c/td>\u003ctd>\u003ccode>{id, title, score}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1000 条列表\u003c/td>\u003ctd>前 20 条 + \u003ccode>{\"total\": 1000}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5000 字文档全文\u003c/td>\u003ctd>前 800 字 + \u003ccode>\"...[已截断，共 5123 字]\"\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>长结果三招\u003c/strong>：① 截断 + 省略提示（最省，但模型不知道后半段有什么）② 先用小模型摘要再回填（多一次调用，信息有损）③ 分页式工具（给 \u003ccode>offset\u003c/code>/\u003ccode>limit\u003c/code> 参数，让模型自己决定要不要下一段——最灵活，但要额外一轮）。\u003c/p>\n\u003cp>\u003cstrong>裁剪顺序\u003c/strong>：先删最早的完整轮次（保留 system + 最近 N 轮），因为当前任务依赖最近几轮。不要动「最近一轮的 tool 消息」——模型正在用它。也永远不要单独删中间的 tool 消息：结构会不成对；就算 API 不报错，assistant 里还留着 tool_calls 记录，模型会以为「我调了但没结果」，可能重复调用。\u003c/p>\n\u003cp>\u003cstrong>预留输出空间\u003c/strong>：算上下文预算时要扣掉 \u003ccode>max_tokens\u003c/code>，别把窗口塞满导致输出被截断。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：三轮工具调用之后，messages 里具体有哪些消息？顺序是什么？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：按顺序背出来——system → user → assistant(tool_calls A,B) → tool(A) → tool(B) → assistant(tool_calls C) → tool(C) → assistant(最终文本)。强调两点：每个 id 有且只有一条对应 tool 消息；顺序要能对上（虽然靠 id 匹配，但乱序容易在裁剪时出错）。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：工具返回 5000 字，你直接塞回去吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：不。先问「模型要用它干什么」——只是判断有没有记录，就返回 \u003ccode>{found, id, title}\u003c/code>；要引用原文，就返回截断版 + 总字数。5000 字 ≈ 3000+ token，一次问答就吃掉大半窗口，而且长文本会稀释注意力（lost in the middle），塞进去不等于用上了。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：上下文超了，先裁哪部分？为什么不能裁中间的 tool 消息？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：先删最早的完整轮次（最老的一问一答），保留 system 和最近几轮。不能单独裁 tool 消息有两个原因：结构不成对，API 直接报错；就算不报错，assistant 里还留着 tool_calls，模型会以为「调了但没结果」，可能重复调用。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：怎么让模型知道某个工具已经调过了，避免重复调？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：上下文里本来就有记录，问题出在\u003cstrong>结果为空\u003c/strong>时模型会重试。做法：空结果显式写清 \u003ccode>{\"found\": false, \"note\": \"已查询，该条件无记录，不要重复查询\"}\u003c/code>；system 里加「同一工具同一参数最多 2 次」；代码层做幂等缓存，相同参数直接返回缓存 + \u003ccode>cached: true\u003c/code>。\u003c/li>\u003c/ul>","questions":["三轮工具调用之后，messages 里具体有哪些消息？顺序是什么？","工具返回 5000 字，你直接塞回去吗？","上下文超了，先裁哪部分？为什么不能裁中间的 tool 消息？","怎么让模型知道某个工具已经调过了，避免重复调？"]},{"id":"agent-05","title":"工具报错、重复调用、死循环怎么防","stage":"agent","week":"4","file":"cards/02-agent/05-失败处理.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>三类故障：工具报错、空结果反复调、跑飞（死循环 / 发散）\u003c/li>\u003cli>报错回「发生了什么 + 可能原因 + 建议怎么办」，别回堆栈\u003c/li>\u003cli>防护分四层：最大轮次、总超时、重试上限、成本上限\u003c/li>\u003cli>到上限不抛错，降级给「部分答案 + 缺什么」\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>报错分三类，处理方式不同\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>例子\u003c/th>\u003cth>处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>可重试\u003c/td>\u003ctd>超时、429、网络抖动\u003c/td>\u003ctd>退避重试 2~3 次，仍失败再回给模型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>不可重试\u003c/td>\u003ctd>参数错、权限不足、404\u003c/td>\u003ctd>直接包装回给模型，让它改参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>致命\u003c/td>\u003ctd>下游服务挂了\u003c/td>\u003ctd>终止，告知用户「暂时不可用」，别让模型瞎编\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>错误信息的写法对比\u003c/strong>\u003c/p>\n\u003cp>``\u003ccode> 差： Traceback (most recent call last): ... KeyError: 'start_date' 好： {\"ok\": false, \"error_type\": \"missing_param\", \"message\": \"缺少必填参数 start_date\", \"suggestion\": \"请提供日期范围，格式 YYYY-MM-DD，例如 start_date=2026-03-01\"} \u003c/code>``\u003c/p>\n\u003cp>模型看不懂堆栈，但看得懂「缺什么、怎么补」。原始异常同时写进日志给自己排查——\u003cstrong>给模型的和给自己的，是两份不同的东西\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>重复调用的三层防护\u003c/strong>\u003c/p>\n\u003col>\u003cli>上下文层：空结果显式标注「已查询，该条件无记录，不要重复查询」\u003c/li>\u003cli>代码层：幂等缓存 + 调用计数，同一 \u003ccode>(tool, args)\u003c/code> 超过 N 次直接返回「已尝试 N 次，请换方法」\u003c/li>\u003cli>提示层：system 里写明「不要用相同参数重复调用」\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>跑飞的两种表现\u003c/strong>\u003c/p>\n\u003cul>\u003cli>无限循环：一直调同一个工具，或 A→B→A→B 打转\u003c/li>\u003cli>任务发散：越调越偏，用户问面试记录，它去查题库又去查简历\u003c/li>\u003c/ul>\n\u003cp>检测方法：算当前 Action 和原始 user query 的相关性，偏离到一定程度就拉回；或者统计「连续 N 轮没有产生新信息」。\u003c/p>\n\u003cp>\u003cstrong>四层硬约束\u003c/strong>：最大轮次（硬）→ 总超时（硬）→ 单工具重试上限 → 单任务成本上限。\u003cstrong>这些必须是代码里的硬约束，不能写进 prompt 指望模型遵守\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>兜底策略\u003c/strong>：到上限时组装「已知信息 + 缺什么 + 建议用户怎么做」，而不是 500。用户能接受「我查到了 A 但没查到 B，你能补充 C 吗」，不能接受「系统错误」。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：工具抛异常，你原样回给模型还是包装一下？举个实际写法。\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：包装。catch 之后构造 \u003ccode>{\"ok\": false, \"error_type\": \"...\", \"message\": \"缺少 start_date\", \"suggestion\": \"请提供 YYYY-MM-DD 格式的日期\"}\u003c/code> 作为 tool 消息 content 回填，原始异常写日志。原则：模型看不懂堆栈，但看得懂「缺什么、怎么补」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：模型反复调同一个工具，怎么破？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：三层——上下文层把空结果显式标注「已查询，无记录」；代码层幂等缓存 + 计数，超限直接返回「已尝试 N 次，请换方法」；提示层在 system 里写明不要重复调。\u003cstrong>核心是让「重复」在代码层被拦住，而不是靠提示\u003c/strong>。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：最大轮次设 5 的依据是什么？设 3 会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：不能拍。先统计正常任务的轮次分布，取 P95 再留 1~2 轮余量。设 3 的问题：正常的多步任务（查记录 → 查题库 → 打分）正好被截断，用户拿到半成品。设太高（20）则兜底失效，成本和延迟失控。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：达到最大轮次时直接报错，用户体验如何？你会怎么处理？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：很差——用户看到「系统错误」，前面几轮的工作全废。改成降级返回：把已收集到的信息整理成答案 + 明确说明「以下信息不完整，缺少 X」。\u003cstrong>部分成功优于完全失败\u003c/strong>，这也是产品感和工程感的区别。\u003c/li>\u003c/ul>","questions":["工具抛异常，你原样回给模型还是包装一下？举个实际写法。","模型反复调同一个工具，怎么破？","最大轮次设 5 的依据是什么？设 3 会怎样？","达到最大轮次时直接报错，用户体验如何？你会怎么处理？"]},{"id":"agent-06","title":"什么场景不该用 Agent","stage":"agent","week":"4","file":"cards/02-agent/06-什么时候不该用Agent.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>判断标准：步骤能不能画成确定的流程图\u003c/li>\u003cli>能画 → workflow：确定性、可测试、延迟低、成本可预测\u003c/li>\u003cli>不能画（下一步取决于上一步结果）→ 才值得上 Agent\u003c/li>\u003cli>最实用的是混合：外层 workflow 固定骨架，局部用 Agent\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>对照表\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>workflow\u003c/th>\u003cth>Agent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>确定性\u003c/td>\u003ctd>同样输入同样输出\u003c/td>\u003ctd>每次可能不同\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可测试\u003c/td>\u003ctd>能写单测、断言\u003c/td>\u003ctd>只能做 eval、看统计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>延迟\u003c/td>\u003ctd>固定（1 次调用）\u003c/td>\u003ctd>随轮次线性涨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成本\u003c/td>\u003ctd>可预测\u003c/td>\u003ctd>波动大\u003c/td>\u003c/tr>\u003ctr>\u003ctd>出错定位\u003c/td>\u003ctd>看日志哪一步挂\u003c/td>\u003ctd>要复盘整条轨迹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>灵活性\u003c/td>\u003ctd>低\u003c/td>\u003ctd>高\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Agent 值得上的三个信号\u003c/strong>\u003c/p>\n\u003col>\u003cli>路径不固定：要先查 A 才知道该查 B\u003c/li>\u003cli>输入形态多变：自由文本、多模态、格式不统一\u003c/li>\u003cli>需要多轮澄清：信息不全时要主动追问\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>不该用的信号\u003c/strong>（占一个就别上）：步骤能画成流程图；有明确的 if-else 分支；结果要求 100% 可复现；延迟敏感（&lt;1s）；成本敏感。\u003c/p>\n\u003cp>\u003cstrong>混合方案是最实用的答案\u003c/strong>：外层固定骨架（校验 → 检索 → 生成 → 落库），只在「意图识别」或「检索策略选择」这一个环节用 LLM/Agent。这样拿到 90% 的确定性和 10% 的灵活性，而且那 10% 出问题也只影响一个节点。\u003c/p>\n\u003cp>\u003cstrong>反例\u003c/strong>：把「查数据库 → 拼模板 → 返回」做成 Agent，等于用 3 次 LLM 调用换一个 SQL 查询——慢 10 倍、贵 20 倍，还可能查错表。\u003cstrong>判断标准很简单：如果这件事一个 if-else 能写完，就别让模型决定。\u003c/strong>\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你怎么判断一个需求该用 Agent 还是 workflow？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：画流程图。每个节点的下一步是否固定——固定就是 workflow；某个节点的下一步「看返回内容再定」，那个节点才需要 Agent。第二个判断更实用：\u003cstrong>能不能写出确定的输入输出对做单测\u003c/strong>，能写就说明该用 workflow。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：Agent 的成本和延迟比 workflow 高多少？能接受吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：按实测答。量级上：workflow 一次调用；Agent 每步一次调用且每步都带全量上下文，所以 3 步就是 3 倍 token 和 3 倍延迟起步。有数字就报数字，没有就说「我测过同一个任务：workflow 800ms / 0.002 元，Agent 平均 3.2 轮 4.1 秒 / 0.03 元」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：如果业务方坚持要「智能体」，但需求其实是固定流程，你怎么处理？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：别正面反驳「智能体」这个词（它现在是个营销词）。做法：先按需求用 workflow 实现，对外仍叫「智能助手」，能演示、能用；同时留出 Agent 的接口（意图识别那一层）。如果对方明确要求「能自己决定调什么工具」，就上混合方案，把可控的部分固定住。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你的项目里哪部分用了 Agent，哪部分是固定流程？为什么这么切？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：按实际项目答。PassUp Agent：意图识别和工具选择用 LLM（路径不固定，用户可能问记录、问题、评分）；数据校验、打分计算、落库是固定代码（要求可复现、可审计）。切分原则一句话：\u003cstrong>需要理解模糊输入的用模型，需要保证正确结果的用代码。\u003c/strong>\u003c/li>\u003c/ul>","questions":["你怎么判断一个需求该用 Agent 还是 workflow？","Agent 的成本和延迟比 workflow 高多少？能接受吗？","如果业务方坚持要「智能体」，但需求其实是固定流程，你怎么处理？","你的项目里哪部分用了 Agent，哪部分是固定流程？为什么这么切？"]},{"id":"eval-01","title":"eval 集怎么建才不是自欺","stage":"eval","week":"5","file":"cards/03-eval/01-eval集构建.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>来源必须真实：搜索日志、工单、真实提问，自己编的会贴合实现\u003c/li>\u003cli>标注粒度：检索标「期望命中的文档 id」，生成标「关键事实是否包含」\u003c/li>\u003cli>留 20% holdout，调参只看 dev，holdout 只在最后跑一次\u003c/li>\u003cli>50~100 条够看出趋势，30 条以下数字是噪声\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>为什么自己编的 query 无效\u003c/strong>：你会不自觉地用「系统能理解的说法」提问——用文档里的词、避开边界情况、避开自己知道系统答不好的问题。结果 eval 分数虚高，上线就崩。\u003cstrong>eval 集的价值全在「不受你预期影响」\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>规模\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>条数\u003c/th>\u003cth>能干什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>&lt; 30\u003c/td>\u003ctd>一条错就是 3+ 个百分点，看不出改动是否有效\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50~100\u003c/td>\u003ctd>能看出趋势，性价比最高（小项目选这个）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>500+\u003c/td>\u003ctd>才谈得上统计显著，一般公司级项目才需要\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>标注粒度（最关键的一条）\u003c/strong>\u003c/p>\n\u003cul>\u003cli>检索任务：标「这个 query 应该命中哪几个 chunk / 文档 id」。多个相关就都标上——它就是 recall 的分母。\u003c/li>\u003cli>生成任务：标「必须包含的关键事实点」（checklist），\u003cstrong>不要标整段参考答案\u003c/strong>。原因：整段没法自动比对，同一个意思有无数种说法，措辞差异会被误判成错误。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>污染控制\u003c/strong>：调参时反复看同一批数据 = 在这批数据上过拟合。做法是 dev / holdout 划分（80/20），调参期间只看 dev；holdout 只在阶段结束时跑一次，跑完不改代码；如果忍不住改了，就重新划一批 holdout。同时记录「每个版本的分数是在哪批数据上测的」，防止拿 dev 分数对外报。\u003c/p>\n\u003cp>\u003cstrong>更新\u003c/strong>：每月从新数据补 10 条（用户分布会漂移，老 query 不代表现在的用户）。旧的不扔——留着才能做跨版本对比（「v1 在 2026-11 这批上 0.72，v2 在同一批上 0.81」），但要标注批次。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：100 条从哪来的？为什么不是 20 条或 1000 条？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：来源要具体（「从笔记站真实搜索记录里抽了 120 条，去掉重复和无效的剩 100 条」）。规模逻辑：20 条一条错就是 5 个百分点，看不出改动是否有效；1000 条标注成本太高。核心是\u003cstrong>能分辨改进\u003c/strong>，不是数字好看。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：期望输出怎么标？标整段话还是标关键点？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：关键点（checklist）。整段参考答案没法自动比对，且同义表述会被误判。关键点可以逐条判「有 / 没有」，人和 judge 都能判。检索任务则标文档 id——客观、可自动算 recall。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：你怎么保证 eval 集没被「调参调出来」？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：holdout 隔离 + 纪律。80/20 划分，调参只看 dev；holdout 跑完不改代码；忍不住改了就把 holdout 换一批。另外记录每个版本的分数来自哪批数据，防止拿 dev 分数对外报——这一条是「自欺」和「严谨」的分界线。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：eval 集多久更新一次？旧的是扔掉还是留着？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：每月补 10 条新数据（分布会漂移）。旧的不扔——留着才能跨版本对比。但要标批次，报数字时说清是在哪批上测的，否则「recall 从 0.6 到 0.8」可能只是换了批更容易的题。\u003c/li>\u003c/ul>","questions":["100 条从哪来的？为什么不是 20 条或 1000 条？","期望输出怎么标？标整段话还是标关键点？","你怎么保证 eval 集没被「调参调出来」？","eval 集多久更新一次？旧的是扔掉还是留着？"]},{"id":"eval-02","title":"LLM-as-judge 怎么用才可信","stage":"eval","week":"5","file":"cards/03-eval/02-LLM-as-judge.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>四类偏差：偏好长答案、偏好自己的输出、位置偏差、偏好格式漂亮的\u003c/li>\u003cli>一致率 = judge 与人工同批判定一致比例，低于 80% 说明 judge prompt 有问题\u003c/li>\u003cli>judge 是放大器不是裁判：全量跑 judge，人工校准 judge\u003c/li>\u003cli>不一致样本是最值钱的东西，能看出 judge 错在哪\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>已知偏差与缓解\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>偏差\u003c/th>\u003cth>表现\u003c/th>\u003cth>缓解\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>长度偏差\u003c/td>\u003ctd>长答案得分高（信息量看起来大）\u003c/td>\u003ctd>prompt 里明确「长度不是评分维度」；做长度对照实验验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自我偏好\u003c/td>\u003ctd>同模型当 judge 给自己的输出打高分\u003c/td>\u003ctd>换不同家族的模型当 judge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>位置偏差\u003c/td>\u003ctd>A/B 对比时偏第一个\u003c/td>\u003ctd>交换顺序各判一次，不一致就算平局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>格式偏差\u003c/td>\u003ctd>markdown 排版漂亮的分高\u003c/td>\u003ctd>评分维度拆开，格式单独一项、低权重\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>judge prompt 怎么写\u003c/strong>：给评分维度 + 每档的具体描述 + 反例（什么情况该给低分）+ 要求\u003cstrong>先输出理由再给分\u003c/strong>（CoT 能显著提升一致率）。维度越具体，一致率越高；「请评价这个回答好不好」这种 prompt 一致率必然低。\u003c/p>\n\u003cp>\u003cstrong>一致率怎么算\u003c/strong>：同一批 N 条样本，人工标一遍、judge 标一遍，\u003ccode>一致条数 / N\u003c/code>。分类任务更严谨用 Cohen's kappa（扣掉随机一致）。\u003cstrong>低于 80% 基本说明 judge prompt 有系统性问题\u003c/strong>，不是「模型不行」。\u003c/p>\n\u003cp>\u003cstrong>定位\u003c/strong>：judge 是放大器，不是裁判。全量数据用 judge 跑（100 条 × 每次改动都跑，成本可接受），人工只用来校准 judge（抽 20~30 条）。反过来（人工跑全量）成本不可持续；只跑 judge 不校准（judge 偏差不会被样本量抵消，1000 条一样偏）。\u003c/p>\n\u003cp>\u003cstrong>不一致样本是最有价值的东西\u003c/strong>：把 judge 和人工不一致的挑出来看，如果都是「长答案 judge 给高分」，那就是长度偏差；如果都是「格式漂亮但内容错」，那就是格式偏差。\u003cstrong>发现偏差的方法不是读论文，是做一致率分析。\u003c/strong>\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：judge 会有什么系统性偏差？你怎么发现的？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：列四类（长度 / 自我偏好 / 位置 / 格式），然后\u003cstrong>重点说怎么发现的\u003c/strong>——做一致率分析，把不一致样本挑出来归类。如果都是长答案分高，就是长度偏差。这一步不做，就只是「听说有偏差」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：一致率怎么算？算出来 65% 怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：\u003ccode>一致条数 / 总条数\u003c/code>（更严谨用 kappa 扣随机）。65% 说明 judge prompt 有系统性问题：先看 10 条不一致样本找模式，然后改 prompt（补反例、拆维度、要求先给理由），改完重测。\u003cstrong>不要直接信 judge 的分，也不要直接换成人工全标。\u003c/strong>\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不能只用 judge，不加人工？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：judge 的偏差是\u003cstrong>系统性的\u003c/strong>，不是随机噪声，所以不会因为样本多而抵消——1000 条一样偏。人工的作用不是「多标一些」，是「校准尺子」。另外 judge 判断不了「事实是否正确」（它不知道 ground truth），只能判断「看起来对不对」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：judge 用同一个模型还是换一个更强的？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：换\u003cstrong>不同家族\u003c/strong>的更强模型最好，能避开自我偏好。折中：同尺寸但不同家族的模型（生成用 A，judge 用 B）。只能用同一个时，prompt 里加「严格评分」约束，并用人工一致率验证有效性。\u003c/li>\u003c/ul>","questions":["judge 会有什么系统性偏差？你怎么发现的？","一致率怎么算？算出来 65% 怎么办？","为什么不能只用 judge，不加人工？","judge 用同一个模型还是换一个更强的？"]},{"id":"eval-03","title":"准确率、幻觉率、耗时怎么定义","stage":"eval","week":"5","file":"cards/03-eval/03-指标定义.md","filled":true,"hasNumbers":false,"short":"\u003cblockquote>\u003cp>关键词桩，不是成稿。合上卡，用这几根桩自己连成 5 句话。\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>准确率：关键事实点是否命中 + 有没有引入资料外的陈述\u003c/li>\u003cli>幻觉率：只统计「说了但资料里没有」的内容，边界要写死\u003c/li>\u003cli>耗时拆开记：检索 / rerank / 生成首 token / 生成总时长\u003c/li>\u003cli>只定三个是为了能归因，三个刚好对应三个优化方向\u003c/li>\u003c/ul>","expand":"\u003cp>\u003cstrong>准确率\u003c/strong>：不是「和参考答案字面一致」，而是「关键事实点全部命中 + 没有引入资料外的错误陈述」。三档判定：\u003c/p>\n\u003cul>\u003cli>完全正确：关键点全覆盖，无编造\u003c/li>\u003cli>部分正确：缺关键点，但没编（可以算半分或算错，\u003cstrong>要提前定死\u003c/strong>）\u003c/li>\u003cli>错误：编造了，或答非所问\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>幻觉率\u003c/strong>：分母是「所有回答」，分子是「包含至少一处编造的回答」。编造包括：编字段、编数字、把不存在的来源说成存在、把资料里 A 的属性安到 B 上。\u003cstrong>必须写清边界\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>回答说「资料里没有提到」→ \u003cstrong>不算\u003c/strong>幻觉\u003c/li>\u003cli>资料说 A&gt;B、B&gt;C，回答 A&gt;C → \u003cstrong>不算\u003c/strong>幻觉（合理推理）\u003c/li>\u003cli>只对检索到的 top-k 判定（不要求模型知道全库）\u003c/li>\u003c/ul>\n\u003cp>不写边界，两个人算出来的幻觉率能差一倍。\u003c/p>\n\u003cp>\u003cstrong>耗时\u003c/strong>：端到端（用户感知）+ 拆分（检索 ms / rerank ms / 生成首 token ms / 生成总时长）。RAG 场景 3~5 秒是心理阈值；首 token 决定「感觉快不快」；拆开是为了定位——检索 800ms + 生成 2s 时，优化方向完全不同（检索能加缓存/换 ANN，生成只能换小模型/流式）。\u003c/p>\n\u003cp>\u003cstrong>为什么只定三个\u003c/strong>：能归因。指标多了会互相矛盾（准确率涨但幻觉率也涨，看不出该改哪），而且没人看。三个刚好对应三个优化方向：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>指标\u003c/th>\u003cth>变差时该改什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>准确率\u003c/td>\u003ctd>检索质量、prompt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>幻觉率\u003c/td>\u003ctd>约束（「资料里没有就说没有」）、引用机制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>耗时\u003c/td>\u003ctd>检索链路、模型选型、流式\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>每个指标都要配「谁判、怎么判、抽样多少」三件套，否则数字不可复现。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：准确率的判定标准是什么？谁判的？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：标准要可操作（关键点 checklist + 是否引入资料外陈述），三档判定。「部分正确」怎么算要提前定死（算错还是半分），否则数字没法复现。谁判：人工标全量做基准，judge 跑后续版本，一致率 80%+ 才信 judge。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：幻觉率怎么算才不是拍脑袋？边界怎么定？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：三件套——定义（陈述在检索到的资料里找不到依据）、边界（排除「承认不知道」、排除合理推理）、流程（只对 top-k 判定，两人各判 20 条算一致率）。\u003cstrong>关键是边界写下来\u003c/strong>，否则换个人算就差一倍。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么只定三个指标？不多测几个吗？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：能归因。三个分别对应三个优化方向（检索/prompt、约束/引用、链路/选型），互相矛盾时也知道该看哪个。多了会互相打架且没人看。如果追问「还要加什么」，答「上线后加业务指标：追问率、转人工率、用户满意度」。\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：耗时是端到端还是首 token？为什么要拆开记？\u003cbr>\u003cstrong>A\u003c/strong>：\u003cstrong>要点\u003c/strong>：两个都要——端到端是用户感知（3~5 秒是阈值），首 token 是「感觉快不快」。拆开是为了\u003cstrong>定位\u003c/strong>：检索 800ms + 生成 2s，优化方向完全不同。只记总时长的话，改了半天不知道改对没有。\u003c/li>\u003c/ul>","questions":["准确率的判定标准是什么？谁判的？","幻觉率怎么算才不是拍脑袋？边界怎么定？","为什么只定三个指标？不多测几个吗？","耗时是端到端还是首 token？为什么要拆开记？"]}]</script>
<script type="application/json" id="initial-state">{}</script>
<script>
/* 学习训练场 · 复习界面 */
;(function () {
  'use strict'

  var CARDS = JSON.parse(document.getElementById('cards-data').textContent)
  var INITIAL_STATE = JSON.parse(document.getElementById('initial-state').textContent)
  var KEY = 'llm-learning-state-v1'
  var THEME_KEY = 'llm-theme'

  // ── 日期 ────────────────────────────────────────────
  function pad(n) {
    return n < 10 ? '0' + n : '' + n
  }
  function fmt(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  }
  function todayStr() {
    return fmt(new Date())
  }
  function addDays(n) {
    var d = new Date()
    d.setDate(d.getDate() + n)
    return fmt(d)
  }

  // ── 状态 ────────────────────────────────────────────
  var state = (function () {
    try {
      var raw = localStorage.getItem(KEY)
      if (raw) return JSON.parse(raw)
    } catch (e) {}
    return JSON.parse(JSON.stringify(INITIAL_STATE))
  })()

  function saveState() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state))
    } catch (e) {}
  }

  function nextInterval(level, prev) {
    var streak = (prev && prev.streak) || 0
    if (level === 1) return { days: 1, streak: 0 }
    if (level === 2) return { days: 3, streak: 0 }
    var s = streak + 1
    return { days: s >= 3 ? 21 : 7, streak: s }
  }

  var today = todayStr()

  function filledCards() {
    return CARDS.filter(function (c) {
      return c.filled
    })
  }

  function dueList() {
    return filledCards()
      .filter(function (c) {
        var s = state[c.id]
        return !s || !s.due || s.due <= today
      })
      .sort(function (a, b) {
        var da = (state[a.id] && state[a.id].due) || '0000'
        var db = (state[b.id] && state[b.id].due) || '0000'
        return da < db ? -1 : da > db ? 1 : 0
      })
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  var STAGE = {
    rag: { short: 'RAG', full: '阶段一 · RAG' },
    agent: { short: 'Agent', full: '阶段二 · Agent' },
    eval: { short: '评测', full: '阶段三 · 评测' },
  }
  function stageShort(s) {
    return (STAGE[s] && STAGE[s].short) || s
  }
  function stageFull(s) {
    return (STAGE[s] && STAGE[s].full) || s
  }

  // ── 会话 ────────────────────────────────────────────
  var session = null // { cards: [], pos: 0, scores: [] }
  var flipped = false
  var view = 'review'
  var filter = 'all'
  var keyword = ''

  function startSession(cards) {
    session = { cards: cards, pos: 0, scores: [] }
    flipped = false
    showView('review')
    renderReview()
  }

  function showView(v) {
    view = v
    document.querySelectorAll('.view').forEach(function (el) {
      el.classList.toggle('active', el.dataset.view === v)
    })
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('on', b.dataset.goto === v)
    })
    if (v === 'all') renderList()
    if (v === 'review') renderReview()
    window.scrollTo({ top: 0 })
  }

  // ── 顶栏统计 ────────────────────────────────────────
  function renderStats() {
    var f = filledCards().length
    var d = dueList().length
    document.getElementById('stat-filled').innerHTML = '<b>' + f + '</b>/' + CARDS.length
    document.getElementById('stat-due').innerHTML = '今日到期 <b>' + d + '</b>'
    document.getElementById('progress-bar').style.width =
      (CARDS.length ? (f / CARDS.length) * 100 : 0) + '%'
  }

  // ── 复习视图 ────────────────────────────────────────
  function renderReview() {
    var el = document.getElementById('review-body')
    renderStats()

    if (!session) {
      var due = dueList()
      if (!due.length) {
        el.innerHTML = emptyDone()
        return
      }
      // 默认进来到期队列
      session = { cards: due, pos: 0, scores: [] }
    }

    if (session.pos >= session.cards.length) {
      el.innerHTML = sessionDone()
      return
    }

    var c = session.cards[session.pos]
    var s = state[c.id]
    var total = session.cards.length
    var num = session.pos + 1
    var head =
      '<div class="card-head">' +
      '<div class="tag"><em>' +
      stageShort(c.stage) +
      '</em>第 ' +
      esc(c.week || '-') +
      ' 周</div>' +
      (total > 1 ? '<div class="counter">' + num + ' / ' + total + '</div>' : '') +
      '</div>'

    // 未填的卡片：只给问题，不给答案
    if (!c.filled) {
      var qs = (c.questions || [])
        .map(function (q) {
          return '<li>' + esc(q) + '</li>'
        })
        .join('')
      el.innerHTML =
        '<div class="card preview">' +
        head +
        '<h1>' +
        esc(c.title) +
        '</h1>' +
        '<div class="notice">这张还没填「30 秒版」' +
        '<br><span>答案得自己写，写不出来说明还没懂。照着下面几个问题答一遍，就是这张卡的内容。</span></div>' +
        (qs
          ? '<div class="followup"><div class="answer-head">面试官会这么问</div>' +
            '<div class="prose"><ul class="qs">' +
            qs +
            '</ul></div></div>'
          : '') +
        '<div class="actions"><button class="btn" id="btn-back">返回列表</button></div>' +
        '</div>' +
        '<div class="footnote">' +
        esc(c.file) +
        '</div>'
      return
    }

    var backExtra = ''

    // 展开：默认收起，想细看再点开
    if (c.expand) {
      backExtra +=
        '<details class="deep">' +
        '<summary>展开' +
        '<span class="hint-closed"> · 想细看再点开</span>' +
        '<span class="hint-open"> · 点收起</span>' +
        '</summary>' +
        '<div class="prose">' +
        c.expand +
        '</div></details>'
    }

    if (c.followup) {
      backExtra +=
        '<div class="followup">' +
        '<div class="answer-head">追问预演</div>' +
        '<div class="prose">' +
        c.followup +
        '</div></div>'
    }

    el.innerHTML =
      '<div class="card' +
      (flipped ? ' flipped' : '') +
      '" id="card" tabindex="0" role="button">' +
      '<div class="face-front">' +
      head +
      '<h1>' +
      esc(c.title) +
      '</h1>' +
      '<div class="hint">先在心里答一遍，再翻开　<kbd>空格</kbd></div>' +
      '</div>' +
      '<div class="face-back">' +
      '<div class="answer-head">30 秒版</div>' +
      '<div class="prose">' +
      (c.short || '<p>（还没写）</p>') +
      '</div>' +
      backExtra +
      '<div class="actions">' +
      '<button data-score="1"><b>1</b> 没答上</button>' +
      '<button data-score="2"><b>2</b> 说清了</button>' +
      '<button data-score="3"><b>3</b> 能扛追问</button>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '<div class="footnote">' +
      esc(c.file) +
      (s && s.lastReview ? '　上次复习 ' + esc(s.lastReview) : '') +
      '</div>'
  }

  function emptyDone() {
    var todo = CARDS.filter(function (c) {
      return !c.filled
    }).length
    return (
      '<div class="empty">' +
      '<div class="big">今天没有到期的卡</div>' +
      '<p>' +
      (filledCards().length
        ? '间隔重复的休息日也是学习的一部分。想加练可以随机抽一张。'
        : '还没有填完的卡片。先去写一张——只填「30 秒版」那一段就够。') +
      '</p>' +
      '<div class="empty-actions">' +
      (filledCards().length
        ? '<button class="btn primary" id="btn-random">随机抽一张</button>'
        : '') +
      '<button class="btn" id="btn-all">看全部卡片' + (todo ? '（' + todo + ' 张待填）' : '') + '</button>' +
      '</div></div>'
    )
  }

  function sessionDone() {
    var n = session.scores.length
    var sum = session.scores.reduce(function (a, b) {
      return a + b
    }, 0)
    var avg = n ? (sum / n).toFixed(1) : '0'
    var weak = session.scores.filter(function (x) {
      return x === 1
    }).length
    var rest = dueList().length

    return (
      '<div class="empty">' +
      '<div class="big">这一轮结束了</div>' +
      '<p>复习 ' +
      n +
      ' 张，平均 ' +
      avg +
      ' 分' +
      (weak ? '，其中 ' + weak + ' 张没答上' : '，全部答上') +
      (rest ? '。还有 ' + rest + ' 张到期。' : '。') +
      '</p>' +
      '<div class="empty-actions">' +
      (rest ? '<button class="btn primary" id="btn-more">再来一轮</button>' : '') +
      '<button class="btn" id="btn-all">看全部卡片</button>' +
      '</div></div>'
    )
  }

  function flip() {
    if (!session || session.pos >= session.cards.length) return
    var cur = session.cards[session.pos]
    if (!cur || !cur.filled) return
    flipped = !flipped
    var card = document.getElementById('card')
    if (card) card.classList.toggle('flipped', flipped)
    if (flipped) {
      setTimeout(function () {
        var el = document.getElementById('card')
        if (!el) return
        var top = el.getBoundingClientRect().top + window.scrollY - 72
        if (top < window.scrollY) window.scrollTo({ top: top, behavior: 'smooth' })
      }, 10)
    }
  }

  function score(level) {
    if (!session || session.pos >= session.cards.length) return
    var c = session.cards[session.pos]
    if (!c || !c.filled) return
    var prev = state[c.id]
    var r = nextInterval(level, prev)

    state[c.id] = {
      due: addDays(r.days),
      level: level,
      streak: r.streak,
      times: ((prev && prev.times) || 0) + 1,
      lastReview: today,
    }
    saveState()

    session.scores.push(level)
    session.pos++
    flipped = false
    renderReview()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }

  // ── 全部卡片 ────────────────────────────────────────
  function statusOf(c) {
    if (!c.filled) return { cls: 'todo', label: '待填' }
    var s = state[c.id]
    if (!s || !s.due) return { cls: 'fresh', label: '未复习' }
    if (s.due <= today) return { cls: 'due', label: '到期' }
    return { cls: 'ok', label: s.due }
  }

  function renderList() {
    var el = document.getElementById('list')
    var kw = keyword.trim().toLowerCase()

    var items = CARDS.filter(function (c) {
      if (kw && (c.title + ' ' + c.id).toLowerCase().indexOf(kw) < 0) return false
      if (filter === 'due') {
        var s = state[c.id]
        return c.filled && (!s || !s.due || s.due <= today)
      }
      if (filter === 'todo') return !c.filled
      return true
    })

    if (!items.length) {
      el.innerHTML = '<div class="empty"><p>没有匹配的卡片</p></div>'
      return
    }

    var groups = {}
    var order = []
    items.forEach(function (c) {
      if (!groups[c.stage]) {
        groups[c.stage] = []
        order.push(c.stage)
      }
      groups[c.stage].push(c)
    })

    var html = ''
    order.forEach(function (st) {
      html += '<div class="group-title">' + esc(stageFull(st)) + '</div><div class="list">'
      groups[st].forEach(function (c) {
        var stt = statusOf(c)
        var pill = c.filled
          ? c.hasNumbers
            ? '<span class="pill num">有数字</span>'
            : '<span class="pill nonum">缺数字</span>'
          : ''
        html +=
          '<div class="item' +
          (c.filled ? '' : ' todo') +
          '" data-id="' +
          esc(c.id) +
          '">' +
          '<span class="dot ' +
          stt.cls +
          '"></span>' +
          '<div class="item-body">' +
          '<div class="item-title">' +
          esc(c.title) +
          '</div>' +
          '<div class="item-meta"><span>' +
          esc(c.id) +
          '</span><span>' +
          esc(stt.label) +
          '</span></div>' +
          '</div>' +
          pill +
          '</div>'
      })
      html += '</div>'
    })

    el.innerHTML = html
  }

  // ── 事件 ────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var t = e.target

    // 自评
    var sc = t.closest('[data-score]')
    if (sc) {
      e.stopPropagation()
      score(Number(sc.dataset.score))
      return
    }

    // 卡片翻面
    var card = t.closest('#card')
    if (card) {
      if (!flipped) flip()
      return
    }

    // 列表项
    var item = t.closest('.item')
    if (item) {
      var c = CARDS.find(function (x) {
        return x.id === item.dataset.id
      })
      if (c) startSession([c])
      return
    }

    if (t.closest('#btn-back')) return showView('all')

    // 按钮
    if (t.closest('#btn-random')) {
      var f = filledCards()
      if (f.length) startSession([f[Math.floor(Math.random() * f.length)]])
      return
    }
    if (t.closest('#btn-all')) return showView('all')
    if (t.closest('#btn-more')) return startSession(dueList())

    var tab = t.closest('.tab')
    if (tab) {
      session = null
      return showView(tab.dataset.goto)
    }

    var seg = t.closest('[data-filter]')
    if (seg) {
      filter = seg.dataset.filter
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.filter === filter)
      })
      renderList()
      return
    }

    if (t.closest('#btn-theme')) {
      var cur = document.documentElement.getAttribute('data-theme')
      if (!cur) {
        cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      var next = cur === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
      try {
        localStorage.setItem(THEME_KEY, next)
      } catch (err) {}
      return
    }

    if (t.closest('#btn-export')) {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })
      var a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = 'review-state.json'
      a.click()
      return
    }

    if (t.closest('#btn-import')) {
      document.getElementById('file-input').click()
      return
    }

    if (t.closest('#btn-reset')) {
      if (confirm('清空所有复习记录？这个操作不可撤销。')) {
        state = {}
        saveState()
        session = null
        renderReview()
        renderList()
      }
      return
    }
  })

  document.addEventListener('input', function (e) {
    if (e.target.id === 'search-input') {
      keyword = e.target.value
      renderList()
    }
  })

  document.getElementById('file-input').addEventListener('change', function (e) {
    var file = e.target.files[0]
    if (!file) return
    var reader = new FileReader()
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result)
        state = data
        saveState()
        session = null
        renderReview()
        renderList()
        alert('已导入 ' + Object.keys(data).length + ' 条复习记录。')
      } catch (err) {
        alert('文件格式不对，需要 review-state.json。')
      }
    }
    reader.readAsText(file)
    e.target.value = ''
  })

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return
    // 焦点在「展开」的 summary 上时，把空格/回车让给折叠，别抢去翻面
    if (e.target.closest && e.target.closest('summary')) return
    if (view !== 'review' || !session) return

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault()
      if (!flipped) flip()
    } else if (flipped && (e.key === '1' || e.key === '2' || e.key === '3')) {
      e.preventDefault()
      score(Number(e.key))
    }
  })

  // ── 初始化 ──────────────────────────────────────────
  try {
    var th = localStorage.getItem(THEME_KEY)
    if (th) document.documentElement.setAttribute('data-theme', th)
  } catch (e) {}

  renderStats()
  showView('review')
})()

</script>
</body>
</html>
