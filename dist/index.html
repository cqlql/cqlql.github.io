<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>大模型应用 · 学习训练场</title>
<style>
/* ── 主题变量 ────────────────────────────────────────── */
:root {
  --bg: #fbfaf8;
  --bg-glass: rgba(251, 250, 248, 0.86);
  --surface: #ffffff;
  --surface-2: #f5f3ef;
  --border: #e7e3dc;
  --border-strong: #d8d3ca;
  --text: #23201c;
  --text-2: #6f6a63;
  --text-3: #a29c93;
  --accent: #3b5bdb;
  --accent-soft: #eef1ff;
  --ok: #2b8a3e;
  --ok-soft: #ebfbee;
  --warn: #d9480f;
  --warn-soft: #fff4e6;
  --bad: #c92a2a;
  --bad-soft: #fff5f5;
  --shadow: 0 1px 2px rgba(35, 32, 28, 0.04), 0 10px 30px -14px rgba(35, 32, 28, 0.16);
  --radius: 14px;
}

:root[data-theme='dark'] {
  --bg: #131316;
  --bg-glass: rgba(19, 19, 22, 0.86);
  --surface: #1b1b20;
  --surface-2: #232329;
  --border: #2c2c34;
  --border-strong: #3a3a44;
  --text: #e9e6e1;
  --text-2: #a8a29b;
  --text-3: #7a746d;
  --accent: #8da2ff;
  --accent-soft: #1e2340;
  --ok: #63d471;
  --ok-soft: #16261a;
  --warn: #ffa94d;
  --warn-soft: #2a1f12;
  --bad: #ff8787;
  --bad-soft: #2a1616;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -14px rgba(0, 0, 0, 0.5);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #131316;
    --bg-glass: rgba(19, 19, 22, 0.86);
    --surface: #1b1b20;
    --surface-2: #232329;
    --border: #2c2c34;
    --border-strong: #3a3a44;
    --text: #e9e6e1;
    --text-2: #a8a29b;
    --text-3: #7a746d;
    --accent: #8da2ff;
    --accent-soft: #1e2340;
    --ok: #63d471;
    --ok-soft: #16261a;
    --warn: #ffa94d;
    --warn-soft: #2a1f12;
    --bad: #ff8787;
    --bad-soft: #2a1616;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -14px rgba(0, 0, 0, 0.5);
  }
}

/* ── 基础 ────────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* ── 顶栏 ────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.brand span {
  color: var(--text-3);
  font-weight: 400;
}

.topbar-spacer {
  flex: 1;
}

.stat {
  font-size: 13px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.stat b {
  color: var(--text);
  font-weight: 600;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--text-2);
  transition: background 0.15s;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}

/* ── 进度条 ──────────────────────────────────────────── */
.progress-line {
  height: 3px;
  background: var(--surface-2);
  position: relative;
  overflow: hidden;
}

.progress-line i {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ── 主体 ────────────────────────────────────────────── */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

.view {
  display: none;
}

.view.active {
  display: block;
}

/* ── 复习卡 ──────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 36px 40px 32px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.2s;
}

.card:hover {
  box-shadow: 0 1px 2px rgba(35, 32, 28, 0.04), 0 14px 40px -16px rgba(35, 32, 28, 0.22);
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.card.flipped {
  cursor: default;
}

.face-front {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  padding: 20px 0;
}

.card.flipped .face-front {
  display: none;
}

.face-back {
  display: none;
}

.card.flipped .face-back {
  display: block;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--text-3);
  text-transform: uppercase;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.counter {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}

.notice {
  margin-top: 22px;
  padding: 13px 16px;
  border-radius: 10px;
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 24%, transparent);
  color: var(--warn);
  font-size: 14.5px;
  line-height: 1.7;
}

.notice span {
  color: var(--text-2);
  font-size: 13.5px;
}

.prose ul.qs {
  padding-left: 20px;
}

.prose ul.qs li {
  margin-bottom: 10px;
  color: var(--text-2);
}

.card.preview {
  cursor: default;
}

.card.preview:hover {
  box-shadow: var(--shadow);
}

.tag em {
  font-style: normal;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 1px 7px;
  border-radius: 5px;
  letter-spacing: 0;
  text-transform: none;
  font-size: 11.5px;
}

.card h1 {
  font-size: 27px;
  line-height: 1.45;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}

.hint {
  margin-top: 32px;
  font-size: 13px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 7px;
}

.hint kbd {
  font-family: inherit;
  font-size: 11px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0 5px;
  color: var(--text-2);
}

/* ── 答案区 ──────────────────────────────────────────── */
.answer-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 500;
}

.answer-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.prose {
  font-size: 16.5px;
  line-height: 1.82;
  color: var(--text);
}

.prose p {
  margin: 0 0 14px;
}

.prose p:last-child {
  margin-bottom: 0;
}

.prose strong {
  font-weight: 600;
  color: var(--text);
}

.prose code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 5px;
}

.prose ul,
.prose ol {
  margin: 0 0 14px;
  padding-left: 22px;
}

.prose li {
  margin-bottom: 8px;
}

.prose li::marker {
  color: var(--text-3);
}

.prose blockquote {
  margin: 0 0 14px;
  padding: 10px 16px;
  border-left: 3px solid var(--border-strong);
  background: var(--surface-2);
  border-radius: 0 8px 8px 0;
  color: var(--text-2);
  font-size: 15px;
}

.prose blockquote p {
  margin: 0;
}

.prose table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 16px;
  font-size: 14.5px;
}

.prose th,
.prose td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
}

.prose th {
  background: var(--surface-2);
  font-weight: 600;
  font-size: 13.5px;
  color: var(--text-2);
}

.prose a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}

/* 追问预演 */
.followup {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px dashed var(--border-strong);
}

.followup .prose {
  font-size: 15.5px;
  line-height: 1.8;
}

.followup .prose ul {
  list-style: none;
  padding-left: 0;
}

.followup .prose li {
  position: relative;
  padding-left: 20px;
  margin-bottom: 16px;
}

.followup .prose li::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--border-strong);
}

.followup .prose li strong:first-child {
  color: var(--text-2);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: 0.02em;
}

/* ── 展开（折叠参考） ────────────────────────────────── */
.deep {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px dashed var(--border-strong);
}

.deep > summary {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  list-style: none;
  user-select: none;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--text-3);
  text-transform: uppercase;
  transition: color 0.15s;
}

.deep > summary::-webkit-details-marker {
  display: none;
}

.deep > summary::before {
  content: '＋';
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  font-size: 11px;
  line-height: 1;
  color: var(--text-3);
  letter-spacing: 0;
}

.deep[open] > summary::before {
  content: '－';
}

.deep[open] .hint-closed,
.deep:not([open]) .hint-open {
  display: none;
}

.deep > summary:hover {
  color: var(--text-2);
}

.deep > summary:hover::before {
  border-color: var(--text-3);
  color: var(--text-2);
}

.deep > summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.deep .prose {
  margin-top: 16px;
  font-size: 15.5px;
  line-height: 1.8;
}

.deep .prose > :first-child {
  margin-top: 0;
}

/* ── 自评按钮 ────────────────────────────────────────── */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}

.actions button {
  flex: 1;
  padding: 11px 8px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  transition: all 0.14s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.actions button b {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  opacity: 0.55;
}

.actions button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px -4px rgba(35, 32, 28, 0.18);
}

.actions button[data-score='1']:hover {
  border-color: var(--bad);
  color: var(--bad);
  background: var(--bad-soft);
}

.actions button[data-score='2']:hover {
  border-color: var(--warn);
  color: var(--warn);
  background: var(--warn-soft);
}

.actions button[data-score='3']:hover {
  border-color: var(--ok);
  color: var(--ok);
  background: var(--ok-soft);
}

.actions button:active {
  transform: translateY(0);
}

/* 预览页只有一个按钮时不要撑满 */
.actions > .btn {
  flex: 0 0 auto;
  padding: 9px 26px;
}

/* ── 空状态 ──────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 72px 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  color: var(--text-2);
}

.empty .big {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.empty p {
  margin: 0 0 24px;
  font-size: 14.5px;
}

.empty-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 9px 18px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 14px;
  color: var(--text);
  transition: all 0.14s;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.primary:hover {
  opacity: 0.9;
  color: #fff;
}

/* ── 标签切换 ────────────────────────────────────────── */
.tabs {
  display: flex;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 9px 2px 10px;
  margin-right: 24px;
  font-size: 14.5px;
  color: var(--text-3);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}

.tab:hover {
  color: var(--text-2);
}

.tab.on {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 500;
}

/* ── 全部卡片 ────────────────────────────────────────── */
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.search input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search input::placeholder {
  color: var(--text-3);
}

.search svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}

.seg {
  display: flex;
  background: var(--surface-2);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}

.seg button {
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--text-2);
  transition: all 0.14s;
  white-space: nowrap;
}

.seg button.on {
  background: var(--surface);
  color: var(--text);
  font-weight: 500;
  box-shadow: 0 1px 3px rgba(35, 32, 28, 0.1);
}

.group-title {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 28px 0 10px;
  font-weight: 500;
}

.group-title:first-child {
  margin-top: 0;
}

.list {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

.item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
}

.item:last-child {
  border-bottom: none;
}

.item:hover {
  background: var(--surface-2);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--border-strong);
}

.dot.due {
  background: var(--bad);
  box-shadow: 0 0 0 3px var(--bad-soft);
}

.dot.fresh {
  background: var(--warn);
}

.dot.ok {
  background: var(--ok);
}

.dot.todo {
  background: transparent;
  border: 1.5px dashed var(--border-strong);
}

.item-body {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item.todo .item-title {
  color: var(--text-3);
}

.item-meta {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  display: flex;
  gap: 10px;
  margin-top: 1px;
}

.pill {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 5px;
  flex-shrink: 0;
  font-weight: 500;
}

.pill.num {
  background: var(--ok-soft);
  color: var(--ok);
}

.pill.nonum {
  background: var(--bad-soft);
  color: var(--bad);
}

/* ── 底部提示 ────────────────────────────────────────── */
.footnote {
  margin-top: 28px;
  font-size: 12.5px;
  color: var(--text-3);
  text-align: center;
  line-height: 1.7;
}

/* ── 移动端 ──────────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar-inner {
    padding: 0 16px;
    height: 52px;
    gap: 10px;
  }

  .brand span {
    display: none;
  }

  main {
    padding: 20px 16px 60px;
  }

  .card {
    padding: 26px 22px 22px;
    min-height: 260px;
  }

  .card h1 {
    font-size: 21px;
  }

  .prose {
    font-size: 16px;
  }

  /* 窄屏下「展开」里的对比表横向滚动，别把卡片撑破 */
  .deep .prose table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .deep .prose th,
  .deep .prose td {
    white-space: nowrap;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    padding: 13px 8px;
  }

  .item {
    padding: 13px 14px;
    gap: 11px;
  }

  .item-title {
    white-space: normal;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">学习训练场 <span>· 大模型应用</span></div>
    <div class="topbar-spacer"></div>
    <div class="stat" id="stat-filled"></div>
    <div class="stat" id="stat-due"></div>
    <button class="icon-btn" id="btn-theme" title="切换深浅色" aria-label="切换深浅色">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
    </button>
  </div>
  <div class="progress-line"><i id="progress-bar" style="width:0"></i></div>
</div>

<main>
  <div class="tabs">
    <button class="tab on" data-goto="review">今日复习</button>
