登录鉴权和 UI 库——企微走 JS-SDK 免登；桌面端用 Electron + Forge，重点是托盘常驻、单实例锁、自动更新、preload 隔离；官网用 Astro SSR 而不是 SPA，因为要 SEO。\u003c/p>","expand":"\u003cul>\u003cli>同一套逻辑多端：内核共用，壳不同，避免三份业务代码\u003c/li>\u003cli>桌面端的四个点：托盘常驻、单实例锁避免重复启动、自动更新、preload 隔离（渲染进程不开 nodeIntegration）\u003c/li>\u003cli>官网的取舍：SEO 和首屏直出优先，SSR 比 SPA 值得\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：Electron 的安全怎么保证？\u003cbr>\u003cstrong>A\u003c/strong>：渲染进程不开 nodeIntegration，能力全走 preload 暴露的有限接口；外部链接走系统浏览器。这是最低限度，再往上要加 CSP。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：官网为什么不用 SPA？\u003cbr>\u003cstrong>A\u003c/strong>：要 SEO 和首屏直出。功能页、10 类行业方案、模板中心，服务端拉列表直接出 HTML。\u003c/li>\u003c/ul>","questions":["Electron 的安全怎么保证？","官网为什么不用 SPA？"]},{"id":"java-01","title":"2023 年才转 Java 为什么现在投后端","stage":"java","week":"","file":"cards/04-面试/02-Java/01-为什么现在投后端.md","filled":true,"hasNumbers":true,"short":"\u003cp>2023 年起在筱沅做服务端，2026 年 2 月起独立负责 PassUp 后端，从建表、接口到部署全部自己来。后端仓库 398 次提交，其中 382 次是我，721 个类、47 个迁移、677 个单测。不是我前端干不下去，是这几年一直在往服务端走。\u003c/p>","expand":"\u003cul>\u003cli>事实、证据、落点三段，别绕\u003c/li>\u003cli>被追问 2023-2025 在做什么：那段时间同时负责小钉贴的前端架构，2026 年起重心完全转到后端\u003c/li>\u003cli>落点：前端经历让我更清楚接口该怎么设计才好用\u003c/li>\u003c/ul>\n\u003cp>⚠️ 不要主动说「那三年在做前端」，但被问不能否认。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：半年后端经验，凭什么比应届或三年后端强？\u003cbr>\u003cstrong>A\u003c/strong>：不比谁强，比的是能一个人打通链路。同一套需求，我不需要前端来找后端对齐三次，接口第一版就按可用性设计。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：那 2023-2025 你到底做什么？\u003cbr>\u003cstrong>A\u003c/strong>：小钉贴的前端架构，五端。岗位挂 Java，服务端和 AI 接口也在这个岗位下，所以我没闲着，但主责确实是前端。\u003c/li>\u003c/ul>","questions":["半年后端经验，凭什么比应届或三年后端强？","那 2023-2025 你到底做什么？"]},{"id":"java-02","title":"为什么用 Java 25 和 Spring Boot 4","stage":"java","week":"","file":"cards/04-面试/02-Java/02-Java25与SpringBoot4.md","filled":true,"hasNumbers":true,"short":"\u003cp>新项目从 0 开始，直接选当时最新的 LTS 和配套主线，避免上线即落后——等业务长起来再升级，代价比一开始就用大得多。代价也要认：部分 starter 适配滞后，Hibernate 与 JPA 的行为有变化，是真踩过坑的。\u003c/p>","expand":"\u003cul>\u003cli>为什么敢用：没有历史包袱，没有存量依赖逼着你留在旧版本\u003c/li>\u003cli>代价分类：starter 生态滞后、JPA 行为变化、文档与社区答案少（遇到问题搜不到现成的）\u003c/li>\u003cli>落点：选版本不是炫技，是算过升级成本和生命周期\u003c/li>\u003c/ul>\n\u003cp>⚠️ \u003cstrong>这张卡必须自己补一个真实踩坑\u003c/strong>：具体哪个依赖不兼容、现象是什么、怎么绕过的。讲不出细节，就别把版本号当卖点。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：不怕生态不成熟吗？\u003cbr>\u003cstrong>A\u003c/strong>：怕，所以先跑通最小闭环再铺业务。真遇到 starter 没跟上就临时自己接，不阻塞主线。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：踩过什么坑？\u003cbr>\u003cstrong>A\u003c/strong>：（待补真实案例，不要说「就是有点小问题」这种空话）\u003c/li>\u003c/ul>","questions":["不怕生态不成熟吗？","踩过什么坑？"]},{"id":"java-03","title":"实时语音链路怎么设计","stage":"java","week":"","file":"cards/04-面试/02-Java/03-实时语音链路.md","filled":true,"hasNumbers":true,"short":"\u003cp>上行用 WebSocket 传 PCM 帧，建连即创建会话；豆包 ASR 实时返回，只有 final 才触发 LLM，避免同一句话反复生成；下行 LLM_REPLY 分片推送，最后一片带 final:true。每一环都要有超时和降级，因为任何一环抖动，用户都会以为卡住了。\u003c/p>","expand":"\u003cul>\u003cli>为什么中间结果不触发 LLM：ASR 会反复修正，触发一次就多一轮生成和一次计费\u003c/li>\u003cli>为什么每个环节都要超时：ASR、LLM、TTS 都是外部服务，链路越长越容易被最慢的一环拖住\u003c/li>\u003cli>降级顺序：TTS 失败转纯文本、模型超时返回明确错误，不静默重试到用户失去耐心\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不用 MediaRecorder？\u003cbr>\u003cstrong>A\u003c/strong>：它出的是压缩容器格式，服务端还要解一遍。AudioWorklet 直接拿 PCM，采样率和位深自己控，链路上少一层。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：用户说一半停住怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：ASR 8 秒无音频就终结连接，所以静默要保活，断连要能自动重建，逻辑会话不能跟着断。\u003c/li>\u003c/ul>","questions":["为什么不用 MediaRecorder？","用户说一半停住怎么办？"]},{"id":"java-04","title":"怎么保证一轮只出一条回答","stage":"java","week":"","file":"cards/04-面试/02-Java/04-一轮只出一条回答.md","filled":true,"hasNumbers":true,"short":"\u003cp>同一会话内用状态机串行化，同一时刻只允许一个在途回合；首问和用户作答共享同一份在途状态，不会各自起一条。没用锁，因为锁是跨会话的，这里要的是同一会话内的串行。\u003c/p>","expand":"\u003cul>\u003cli>为什么不用分布式锁：锁的粒度错了。跨会话加锁会互相拖累，这里只需要单会话内排队\u003c/li>\u003cli>状态机比布尔标记好在哪：能表达「进行中 / 待确认 / 已结束」，且非法状态转移能直接拒绝\u003c/li>\u003cli>单线程执行：同一会话的回合按队列推进，避免并发写同一份会话状态\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：多实例部署时怎么保证？\u003cbr>\u003cstrong>A\u003c/strong>：会话有归属节点，粘性路由到同一实例；跨实例续接靠 DB 里的会话状态，不靠内存里的锁。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：用户连点两次发送呢？\u003cbr>\u003cstrong>A\u003c/strong>：在途状态存在就拒绝新的回合，返回当前进度，不排队也不并发。\u003c/li>\u003c/ul>","questions":["多实例部署时怎么保证？","用户连点两次发送呢？"]},{"id":"java-05","title":"断线续接怎么做的","stage":"java","week":"","file":"cards/04-面试/02-Java/05-断线续接.md","filled":true,"hasNumbers":true,"short":"\u003cp>物理连接会断——切后台、杀进程、心跳超时——但逻辑会话不能丢。逻辑会话 ID 取首次建连的 session id，重连时复用。双 TTL：paused 15 分钟是内存态，resumable 1 小时可恢复，判据是数据库里的 paused_at，不是内存。\u003c/p>","expand":"\u003cul>\u003cli>两个 TTL 的语义不同：15 分钟是「用户可能马上回来」的短窗，1 小时是「服务端还愿意为它保留状态」的长窗\u003c/li>\u003cli>为什么判据在 DB：内存态重启就没了，会话能不能恢复必须有个持久的事实\u003c/li>\u003cli>为什么 ID 取首次建连而不是每次新建：否则每次重连都是新会话，历史全丢\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么两个 TTL？\u003cbr>\u003cstrong>A\u003c/strong>：一个是用户体验上的「还算连续」，一个是系统愿意付存储代价的上限。合成一个，要么用户回来发现没了，要么长期占着状态。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：重连后上下文怎么恢复？\u003cbr>\u003cstrong>A\u003c/strong>：会话消息按序存在库里，重连按逻辑 ID 取回来重灌给 LLM，不依赖内存里的那一份。\u003c/li>\u003c/ul>","questions":["为什么两个 TTL？","重连后上下文怎么恢复？"]},{"id":"java-06","title":"退款为什么是两段","stage":"java","week":"","file":"cards/04-面试/02-Java/06-退款两段.md","filled":true,"hasNumbers":true,"short":"\u003cp>钱在微信侧退，系统回滚不了微信的退款，所以资金事实和资产收口必须用两个字段表达。乱序时退款通知可能比发货回调先到，这时先原子改状态抢占幂等，再扣资产——不是先扣后改，顺序反了会把资产重复补出去。\u003c/p>","expand":"\u003cul>\u003cli>两个字段各管什么：\u003ccode>pay_status\u003c/code> 是资金事实，\u003ccode>refund_settle_status\u003c/code> 是资产收口，两者的推进不完全同步\u003c/li>\u003cli>乱序场景走一遍：通知到 → 改状态为已退款 → 检查资产是否已发 → 已发才扣，未发就不扣但记标记\u003c/li>\u003cli>为什么先改状态：状态是幂等闸门，先抢住闸门，后面的动作才不会重复执行\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不能一个字段搞定？\u003cbr>\u003cstrong>A\u003c/strong>：一个是外部资金事实，一个是内部资产处理。资金退了但资产还没扣完，这个中间态必须能被表达出来，否则补偿任务无从下手。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：乱序导致资产多发了怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：这就是先改状态的意义。状态先落成已退款，补发任务查到它就不会再发，等于用状态兜住了乱序。\u003c/li>\u003c/ul>","questions":["为什么不能一个字段搞定？","乱序导致资产多发了怎么办？"]},{"id":"java-07","title":"支付回调重复通知怎么办","stage":"java","week":"","file":"cards/04-面试/02-Java/07-支付回调幂等.md","filled":true,"hasNumbers":true,"short":"\u003cp>微信回调会重试，必须幂等。做法是条件更新抢占：\u003ccode>UPDATE ... WHERE status = '待处理'\u003c/code>，影响行数为 0 说明已经被处理过，直接返回成功。加分点是用唯一索引兜底，以及用状态机而不是布尔标记。\u003c/p>","expand":"\u003cul>\u003cli>为什么用条件更新而不是先查再改：查和改之间有时间窗，两条并发请求会同时查到「待处理」\u003c/li>\u003cli>为什么用状态机而不是布尔：布尔只能表达「处理过没有」，无法表达「处理到哪一步」，退款这类多段流程必须能表达中间态\u003c/li>\u003cli>唯一索引兜底：同一笔业务号的记录只允许一条，写不进去就说明重复\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：两条请求同时到会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：数据库行锁保证只有一个 \u003ccode>WHERE status='待处理'\u003c/code> 能命中，另一条影响行数为 0，当作已处理返回成功。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：返回成功但实际没处理完怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：状态已经落了，后续由补偿任务推进。回调只负责把事实记下来，不负责把所有事做完。\u003c/li>\u003c/ul>","questions":["两条请求同时到会怎样？","返回成功但实际没处理完怎么办？"]},{"id":"java-08","title":"越权为什么返回不存在而不是 403","stage":"java","week":"","file":"cards/04-面试/02-Java/08-越权返回不存在.md","filled":true,"hasNumbers":true,"short":"\u003cp>403 等于告诉对方「这条记录存在，只是你没权限」，可以被用来一条条探测数据。所以「不归你」和「不存在」返回同一个结果。加分点是知道公开端点会跳过 Token 解析，往这类接口里加用户态字段会静默恒为 null。\u003c/p>","expand":"\u003cul>\u003cli>信息泄露的角度：状态码本身也是信息，403 与 404 的差异就是存在性探测的入口\u003c/li>\u003cli>实现上怎么统一：越权判定在数据层做，查不到就统一抛 NOT_FOUND\u003c/li>\u003cli>代价：排障时要靠日志区分「真不存在」和「无权」，不能靠状态码\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那怎么区分两种情况的日志？\u003cbr>\u003cstrong>A\u003c/strong>：接口层不区分，日志里区分。打点时带上「查无此记录」和「存在但归属不符」两种原因，对外都是 404。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：公开接口怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：公开端点跳过 Token 解析，用户态字段会静默为 null。需要单独的可选鉴权分类，不能靠「有没有登录」猜。\u003c/li>\u003c/ul>","questions":["那怎么区分两种情况的日志？","公开接口怎么办？"]},{"id":"java-09","title":"47 个迁移怎么管","stage":"java","week":"","file":"cards/04-面试/02-Java/09-迁移管理.md","filled":true,"hasNumbers":true,"short":"\u003cp>Flyway 版本化，禁止改已经执行过的脚本，只能新增。回滚靠备份恢复，不靠 down 脚本，因为社区版没有 undo。加字段这类变更要单独想清楚默认值和锁级别，不能顺手塞进老脚本里。\u003c/p>","expand":"\u003cul>\u003cli>为什么只增不改：线上已经跑过的脚本一改，各环境的库就和代码分叉了，而且没人知道自己那份到底是什么状态\u003c/li>\u003cli>回滚策略：备份恢复是主线，业务层的兼容靠新迁移里的兜底，不指望逆向脚本\u003c/li>\u003cli>大表加列的注意点：默认值、锁级别、是否需要分批，能讲清 \u003ccode>ALTER TABLE\u003c/code> 的行为最好\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：要改一个字段类型怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：新加一列 → 迁移数据 → 双写或读时兼容 → 下线旧列。不直接改已执行过的脚本。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：多人并行开发迁移版本号冲突呢？\u003cbr>\u003cstrong>A\u003c/strong>：约定时间戳命名并先拉最新，冲突了改自己的版本号，不合并别人的脚本。真要撞了，宁可重排也不改已执行的。\u003c/li>\u003c/ul>","questions":["要改一个字段类型怎么办？","多人并行开发迁移版本号冲突呢？"]},{"id":"java-10","title":"Redis 在这个项目里用来做什么","stage":"java","week":"","file":"cards/04-面试/02-Java/10-Redis用途.md","filled":true,"hasNumbers":true,"short":"\u003cp>这个项目里 Redis 不是业务缓存，主要放会话态：会话与令牌、验证码、WebSocket 票据、计费计时。所以被问缓存穿透、雪崩时，我如实说这个项目没做业务缓存，Redis 用在了状态上。\u003c/p>","expand":"\u003cul>\u003cli>四类键：TokenStore、SessionStore、验证码、建连票据，另有一组计费计时\u003c/li>\u003cli>为什么不拿它做业务缓存：这个项目的读热点在会话上，业务数据量不大，直接查库更快也更简单\u003c/li>\u003cli>知道但没做的：缓存穿透（空值缓存 / 布隆）、雪崩（过期打散）、热 key —— 说出来但别装作做过\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那如果让你加业务缓存，怎么做？\u003cbr>\u003cstrong>A\u003c/strong>：先看读写比，再定 key 粒度；穿透用空值缓存或布隆兜，雪崩给过期时间打散，热 key 走本地缓存加多副本。没做过但要能说清思路。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：Redis 挂了会怎样？\u003cbr>\u003cstrong>A\u003c/strong>：会话和票据全断，用户要重新登录并重建连接。所以 Redis 上只放「丢了能重建」的状态，业务事实一律落库。\u003c/li>\u003c/ul>","questions":["那如果让你加业务缓存，怎么做？","Redis 挂了会怎样？"]},{"id":"java-11","title":"677 个单测怎么写的","stage":"java","week":"","file":"cards/04-面试/02-Java/11-677个单测.md","filled":true,"hasNumbers":true,"short":"\u003cp>JUnit 5 + Mockito，重点覆盖状态机和边界：会话续接、计费门槛、退款乱序、权限归属。ASR、LLM、微信回调全部 mock，不依赖真实网络。也有故意不测的，比如第三方 SDK 的薄封装。\u003c/p>","expand":"\u003cul>\u003cli>为什么集中在这四类：这四处错了不是「不好用」，是「钱错了」或「数据错了」，属于不可接受的错误\u003c/li>\u003cli>怎么 mock 外部服务：接口层抽象好，测试里替换成桩，不穿透到真实网络\u003c/li>\u003cli>故意不测的：第三方 SDK 的薄封装、纯 DTO 的 getter，测了只增加维护成本\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：覆盖率多少？\u003cbr>\u003cstrong>A\u003c/strong>：没统计行覆盖率，按「关键路径必测」来定的。行覆盖率对这类项目是虚荣指标，状态迁移漏测才是风险。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：这些测试能拦住 AI 改坏代码吗？\u003cbr>\u003cstrong>A\u003c/strong>：能拦住状态机和边界被改坏。重构类改动先跑测试，红了就回退，不靠解释。\u003c/li>\u003c/ul>","questions":["覆盖率多少？","这些测试能拦住 AI 改坏代码吗？"]},{"id":"java-12","title":"前端转后端最大的短板是什么","stage":"java","week":"","file":"cards/04-面试/02-Java/12-前端转后端短板.md","filled":true,"hasNumbers":true,"short":"\u003cp>JVM 调优、GC、大规模并发压测，这些没在生产环境深做过。目前靠读源码和单测保证正确性，性能问题先用 Actuator + Prometheus 定位再谈优化。优势是能独立打通前后端，联调成本比纯后端低。\u003c/p>","expand":"\u003cul>\u003cli>三块短板说清楚：JVM 调优、GC、大规模并发压测，不含糊\u003c/li>\u003cli>现在的替代手段：监控先定位，单测保正确性，不做没验证过的「优化」\u003c/li>\u003cli>优势不吹：不是「我什么都会」，是边界清楚，接口设计和联调省一轮返工\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：线上 OOM 你怎么查？\u003cbr>\u003cstrong>A\u003c/strong>：先看监控确认是堆还是元空间，再 dump 下来用 MAT 看占最大头的对象。没在生产上做过，但流程清楚，不确定的我不会装作确定。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：那你凭什么做后端？\u003cbr>\u003cstrong>A\u003c/strong>：凭这半年把建表、接口、迁移、部署、单测全走完一遍，也凭我知道自己哪块不深。\u003c/li>\u003c/ul>","questions":["线上 OOM 你怎么查？","那你凭什么做后端？"]},{"id":"ai-01","title":"你是做算法还是做应用","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/01-算法还是应用.md","filled":true,"hasNumbers":true,"short":"\u003cp>我是 AI 应用开发，负责把模型能力接进产品并保证稳定，不训模型、不做微调。具体是 prompt 设计、结构化输出约束、流式链路、超时与降级、多模型适配。我能判断哪些环节不该用模型，这比会调 API 重要。\u003c/p>","expand":"\u003cul>\u003cli>边界先立住：训模型、微调、蒸馏都不做，含糊到技术面一定露\u003c/li>\u003cli>应用侧的价值：同样接一个模型，能不能稳定、可预期、可回滚\u003c/li>\u003cli>不该用模型的地方：判分、权限、计费，一律走规则\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那你懂模型吗？\u003cbr>\u003cstrong>A\u003c/strong>：懂调用和约束，不懂训练。知道 temperature、上下文窗口、指令跟随强弱这些影响输出的因素，也知道本地部署能干什么。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不学微调？\u003cbr>\u003cstrong>A\u003c/strong>：我这个场景不需要。结构化输出加 Schema 约束已经能把输出限住，微调解决的是风格和领域语言，性价比不高。\u003c/li>\u003c/ul>","questions":["那你懂模型吗？","为什么不学微调？"]},{"id":"ai-02","title":"结构化输出怎么保证模型不乱来","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/02-结构化输出约束.md","filled":true,"hasNumbers":true,"short":"\u003cp>按业务结构动态生成 JSON Schema：字段类型、枚举、嵌套都由业务定义推导——子表转 array、分组转 object。再用 \u003ccode>response_format\u003c/code> 的 json_schema 约束，模型只能输出合法结构。strict 模式有三条硬要求：所有 object 加 \u003ccode>additionalProperties:false\u003c/code>、所有字段进 \u003ccode>required\u003c/code>、不能出现 \u003ccode>$ref\u003c/code> 要内联。\u003c/p>","expand":"\u003cul>\u003cli>为什么要动态生成：Schema 不是手写的，是从表单或实体定义递归长出来的，业务改字段它自己跟着变\u003c/li>\u003cli>strict 的三条硬要求必须背下来：少一条就不是严格模式\u003c/li>\u003cli>取舍：没开 strict 是因为空值字段允许不输出，这是业务决定，不是不会用\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不开 strict？\u003cbr>\u003cstrong>A\u003c/strong>：strict 要求所有字段都出现，但填表场景大量字段本来就该留空。开了会逼模型编一个值填进去，反而更糟。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：嵌套结构怎么处理？\u003cbr>\u003cstrong>A\u003c/strong>：子表转 array，分组转 object，\u003ccode>$ref\u003c/code> 全部内联展开——strict 不允许引用，必须铺平。\u003c/li>\u003c/ul>","questions":["为什么不开 strict？","嵌套结构怎么处理？"]},{"id":"ai-03","title":"模型输出的 JSON 解析失败怎么办","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/03-JSON解析失败.md","filled":true,"hasNumbers":true,"short":"\u003cp>三层。第一层 Schema 约束，从源头减少非法输出；第二层解析失败重试一次，仍失败就返回可读错误，不把异常抛给用户；第三层能降级的降级，比如填表失败就保留手动填写。\u003c/p>","expand":"\u003cul>\u003cli>为什么只重试一次：两次都失败说明不是抖动，是 prompt 或 Schema 有问题，多试只是烧钱\u003c/li>\u003cli>为什么不抛异常给用户：用户看不懂栈，只想知道「现在能不能继续」\u003c/li>\u003cli>降级设计：每个 AI 能力都要有「模型不可用时的兜底路径」，不是可选项\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不是三次五次？\u003cbr>\u003cstrong>A\u003c/strong>：一次重试已经能覆盖大部分抖动。再失败基本是结构性问题，多试只增加成本和延迟，不如把错误暴露出来。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：降级之后用户会不会觉得功能坏了？\u003cbr>\u003cstrong>A\u003c/strong>：会，所以文案要给下一步动作——「自动填充失败，请手动填写」，而不是一个红叉。\u003c/li>\u003c/ul>","questions":["为什么不是三次五次？","降级之后用户会不会觉得功能坏了？"]},{"id":"ai-04","title":"流式输出怎么做的","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/04-流式输出.md","filled":true,"hasNumbers":true,"short":"\u003cp>LLM 增量 token 按句聚合，通过 WebSocket 下发 LLM_REPLY 分片，前端收到就追加渲染。结束信号只认最后一片带的 final:true。坑是 Java 字段叫 isFinal，Jackson 序列化后成了 final，只按 isFinal 找会得出「信号不存在」的错误结论。\u003c/p>","expand":"\u003cul>\u003cli>为什么按句聚合而不是逐 token 推：逐 token 前端渲染成本高，按句更稳，断连时丢的也少\u003c/li>\u003cli>结束信号为什么必须唯一：多个结束判据会打架，前端只能认一个\u003c/li>\u003cli>那个 isFinal 的坑：序列化后的字段名和 Java 属性名不一致，排查了很久\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：丢片了怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：按序号补齐，缺片就整轮重下。前端不做「猜测补全」，猜错比重来更贵。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：前端怎么防重复渲染？\u003cbr>\u003cstrong>A\u003c/strong>：按消息 ID 和片序号去重，同一片到两次直接丢弃，不追加。\u003c/li>\u003c/ul>","questions":["丢片了怎么办？","前端怎么防重复渲染？"]},{"id":"ai-05","title":"ASR 实时识别有什么坑","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/05-ASR的坑.md","filled":true,"hasNumbers":true,"short":"\u003cp>中间结果会反复修正，只有 final 才触发下游，否则同一句话会生成多次回答。豆包 ASR 8 秒收不到音频就终结连接，而静默是常态，所以必须保活加自动重建。断连重建不能丢会话，逻辑会话 ID 要和物理连接解耦。\u003c/p>","expand":"\u003cul>\u003cli>中间结果的本质：ASR 边听边改，越早下游越容易重复\u003c/li>\u003cli>8 秒断连意味着什么：用户思考时就是静默，连接会自己死，不保活就是随机失败\u003c/li>\u003cli>重建不等于重来：重建的是连接，会话状态在库里\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：保活怎么发？\u003cbr>\u003cstrong>A\u003c/strong>：定期发静音帧或心跳，让上游知道这边还活着。不能等断了再重连，那样每一轮都慢半拍。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：那 VAD 用不用？\u003cbr>\u003cstrong>A\u003c/strong>：服务端 ASR 自带断句，前端不再叠一层，两层判在一起容易互相打架。\u003c/li>\u003c/ul>","questions":["保活怎么发？","那 VAD 用不用？"]},{"id":"ai-06","title":"怎么防提示词注入","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/06-防提示词注入.md","filled":true,"hasNumbers":true,"short":"\u003cp>建连只接受资源标识——模板 ID、续接 ID、岗位 ID，绝不接受用户传入的简历正文或岗位正文。传了但无效就直接失败，不静默降级，因为降级等于让用户内容进了系统提示词。角色由后端配置，前端只能选枚举值。\u003c/p>","expand":"\u003cul>\u003cli>为什么「标识」比「正文」安全：标识只能查到服务端存的内容，用户改不动里面的字\u003c/li>\u003cli>为什么不降级：降级路径往往就是漏洞入口，「传了但无效」时若退回用原文，注入就成立了\u003c/li>\u003cli>纵深：prompt 约束只是最后一层，接口隔离和日志隔离才是主线\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那简历解析怎么办，不就得传正文？\u003cbr>\u003cstrong>A\u003c/strong>：解析走独立接口，输入是文件而不是「拼好的 prompt」，模型只做抽取，不参与对话生成。两条链路分开。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：用户把指令写在简历里呢？\u003cbr>\u003cstrong>A\u003c/strong>：解析结果只有结构字段，抽取失败的字段留空，不进对话上下文。写进去也不会被当成指令执行。\u003c/li>\u003c/ul>","questions":["那简历解析怎么办，不就得传正文？","用户把指令写在简历里呢？"]},{"id":"ai-07","title":"为什么判分不用 LLM","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/07-判分不用LLM.md","filled":true,"hasNumbers":true,"short":"\u003cp>8 道选择题的加权总分没有测评意义，LLM 判分只带来不确定性和成本。直接比对选项键，零调用、零延迟、可复现。三条口径：未答不进分母、全未答不出分、不信 is_correct 列，报告时重算。\u003c/p>","expand":"\u003cul>\u003cli>什么场景该用 LLM：需要理解语义、没有标准答案的评估\u003c/li>\u003cli>什么场景不该用：答案唯一、规则可枚举，用了只会引入不确定性\u003c/li>\u003cli>三条口径为什么重要：统计口径一错，报告就不可解释，比分数不准更严重\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那主观题怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：主观题才有必要上模型评分，而且要配评估集和人工抽检。选择题上模型是纯浪费。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：为什么不直接信数据库里的 is_correct？\u003cbr>\u003cstrong>A\u003c/strong>：那个列可能是历史版本写进去的，口径变过就会不一致。报告统一重算，保证同一份数据只有一个口径。\u003c/li>\u003c/ul>","questions":["那主观题怎么办？","为什么不直接信数据库里的 is_correct？"]},{"id":"ai-08","title":"RAG 你怎么做的","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/08-RAG没做过.md","filled":true,"hasNumbers":true,"short":"\u003cp>完整的 RAG 我没做过，所以简历上没写。向量检索的原理清楚——embedding、余弦相似度、top-k——也参与过同事主导的模板检索的一部分，但主导不是我，不算自己的产出。要补的话，先做切分和 50 到 100 条评估集算 recall@5，再决定要不要上 rerank。\u003c/p>","expand":"\u003cul>\u003cli>为什么如实说：RAG 的追问会一路挖到 chunk size、rerank 模型、评估指标，编不过三层\u003c/li>\u003cli>可迁移的部分：结构化输出约束、多模型适配、流式链路，这些和 RAG 的生成侧是同一套能力\u003c/li>\u003cli>补齐路径：切分 → 评估集 → 混合检索 → rerank，见学习计划第 2、5 周\u003c/li>\u003c/ul>\n\u003cp>⚠️ 绝不要临时编一个「做过 RAG」的故事。\u003c/p>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那你凭什么投 AI 岗？\u003cbr>\u003cstrong>A\u003c/strong>：凭有真实的生产级 LLM 落地经验——实时语音链路、结构化输出、多模型适配。RAG 是我在补的，不装。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：你会怎么补？\u003cbr>\u003cstrong>A\u003c/strong>：先用自己笔记站的语料做切分，建 50~100 条 query 的评估集量 recall@5，再决定要不要上 rerank 和混合检索。\u003c/li>\u003c/ul>","questions":["那你凭什么投 AI 岗？","你会怎么补？"]},{"id":"ai-09","title":"多模型怎么适配和降级","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/09-多模型适配降级.md","filled":true,"hasNumbers":true,"short":"\u003cp>provider 抽象把豆包 LLM / ASR / TTS 和本地 vLLM 统一成一套接口，按任务路由——结构化抽取用哪个、实时对话用哪个。降级是 TTS 失败转纯文本、OCR 失败给可操作提示、模型超时返回明确错误。\u003c/p>","expand":"\u003cul>\u003cli>抽象的粒度：按能力分（文本、语音识别、语音合成、结构化抽取），不按厂商分\u003c/li>\u003cli>路由依据：任务对稳定性、延迟、合规的要求不同，一个模型顶不下来\u003c/li>\u003cli>降级的诚实边界：降级会损失功能，但要保住主流程能继续\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：换模型要改多少地方？\u003cbr>\u003cstrong>A\u003c/strong>：改配置和少量适配，业务层不动。接口契约是我们自己定的，不跟着某家的 SDK 走。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：降级会不会把错误藏起来？\u003cbr>\u003cstrong>A\u003c/strong>：会有一条明确的降级日志和用户提示。静默降级最危险，用户以为成功了，其实全丢了。\u003c/li>\u003c/ul>","questions":["换模型要改多少地方？","降级会不会把错误藏起来？"]},{"id":"ai-10","title":"AI 效果怎么衡量","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/10-效果怎么衡量.md","filled":true,"hasNumbers":true,"short":"\u003cp>现在有的是埋点和看板：生成次数、失败率、回合耗时、异常会话。没有的是系统化评估——没有评估集、没有人工评分、没有 A/B。要补就先定义「有用」的代理指标：提示被采纳、用户继续追问、中途退出率，再谈优化。\u003c/p>","expand":"\u003cul>\u003cli>为什么代理指标比主观满意度可靠：采纳和不采纳是有行为的，满意不满意是问出来的\u003c/li>\u003cli>三层评估：检索/生成质量（有标注集）、链路健康（耗时与失败率）、业务结果（采纳与留存）\u003c/li>\u003cli>诚实边界：目前只有第二层\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：没有评估，你怎么知道改动变好还是变坏？\u003cbr>\u003cstrong>A\u003c/strong>：目前靠链路指标和人工抽查，这是不完整的。所以我把评测集列为下一步，没有数字的优化都是猜。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：代理指标会骗人吗？\u003cbr>\u003cstrong>A\u003c/strong>：会，比如用户继续追问可能是不满意也可能是兴趣。所以要两三个指标一起看，别单点下结论。\u003c/li>\u003c/ul>","questions":["没有评估，你怎么知道改动变好还是变坏？","代理指标会骗人吗？"]},{"id":"ai-11","title":"成本怎么控制","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/11-成本控制.md","filled":true,"hasNumbers":true,"short":"\u003cp>四件事。超时预算要对齐，OCR 超时必须小于上游 HTTP 读超时，否则上游已经判失败、这边还在烧 token；结构化输出减少重试，本身就是在省；能用规则解决的不用模型；同一份简历的解析结果复用，不重复调用。\u003c/p>","expand":"\u003cul>\u003cli>超时预算为什么容易错：每一层都自己设超时，外层短内层长，就会出现「已经超时了还在算」\u003c/li>\u003cli>省钱的顺序：先砍不必要的调用，再砍重试，最后才谈换小模型\u003c/li>\u003cli>没做的：token 级动态预算分配\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：一次面试大概多少钱？\u003cbr>\u003cstrong>A\u003c/strong>：按回合估，主要在 ASR 和 LLM 两段。没有做精确到分的成本核算，这是可以补的。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：缓存会不会拿到过期结果？\u003cbr>\u003cstrong>A\u003c/strong>：简历解析按文件内容哈希缓存，文件变了键就变，不会拿到旧结果。\u003c/li>\u003c/ul>","questions":["一次面试大概多少钱？","缓存会不会拿到过期结果？"]},{"id":"ai-12","title":"数据合规怎么处理","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/12-数据合规.md","filled":true,"hasNumbers":true,"short":"\u003cp>音频和简历是敏感数据，本地 vLLM 保证业务数据不出内网；上传文件有孤儿清理策略；声纹是软删除，对外文案不能说「注销即彻底删除」——这是已知缺口，不夸大成已解决。\u003c/p>","expand":"\u003cul>\u003cli>三层处理：本地部署不出网、文件生命周期管理、删除语义要说准\u003c/li>\u003cli>软删除为什么不算彻底删除：数据还在库里，只是不可用。涉及对外承诺时要写清楚\u003c/li>\u003cli>合规边界：等保、个人信息保护法的具体要求我不敢装懂，只讲我做到的部分\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：用户注销后数据还在吗？\u003cbr>\u003cstrong>A\u003c/strong>：声纹是软删除，简历文件按策略清理。严格说不是「彻底删除」，对外文案不能这么写。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：那你怎么保证合规？\u003cbr>\u003cstrong>A\u003c/strong>：我保证的是「业务数据不出内网 + 文件有生命周期」。法律层面的要求我们按公司口径走，我不冒充懂。\u003c/li>\u003c/ul>","questions":["用户注销后数据还在吗？","那你怎么保证合规？"]},{"id":"ai-13","title":"AI 方向你的短板是什么","stage":"ai","week":"","file":"cards/04-面试/03-AI应用/13-AI方向短板.md","filled":true,"hasNumbers":true,"short":"\u003cp>不会训模型，没做过微调和蒸馏；也没有大规模推理优化经验，量化、批处理、KV cache 调优都没碰过。目前靠工程手段保证可用：超时、降级、缓存。\u003c/p>","expand":"\u003cul>\u003cli>三块短板：训练与微调、推理优化、系统化评测\u003c/li>\u003cli>补的顺序：评测最优先，因为没有数字就没法判断改动值不值\u003c/li>\u003cli>不硬撑的部分：vLLM 我会部署会用，但不懂量化与 KV cache 调优\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那你和会微调的人差在哪？\u003cbr>\u003cstrong>A\u003c/strong>：差在模型侧的手艺，不缺应用侧的落地。大多数 AI 应用岗要的其实是后者。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：愿意补吗？\u003cbr>\u003cstrong>A\u003c/strong>：愿意，但顺序是评测 → RAG → Agent。微调和推理优化放最后，因为岗位要求多是「了解即可」。\u003c/li>\u003c/ul>","questions":["那你和会微调的人差在哪？","愿意补吗？"]},{"id":"llm-01","title":"Prompt 怎么管版本","stage":"llm","week":"","file":"cards/04-面试/04-大模型/01-Prompt版本管理.md","filled":true,"hasNumbers":true,"short":"\u003cp>模板加上下文渲染成完整 prompt，渲染结果落库成不可变快照。模板改版不回填历史，所以历史会话能精确复现当时的 prompt。老数据 system_prompt 为空时按快照重算，那是兜底，不是主路径。\u003c/p>","expand":"\u003cul>\u003cli>为什么要存渲染结果而不是模板 ID：模板会改，ID 指向的内容会漂，快照不漂\u003c/li>\u003cli>成本取舍：存快照占空间，但换来可复现，值\u003c/li>\u003cli>边界：兜底路径接受版本漂移，这不是设计目标\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：快照会不会太大？\u003cbr>\u003cstrong>A\u003c/strong>：一条会话一轮，量级可控。真要省可以只存差异，但目前不值得为此加复杂度。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：怎么对比两个模板的效果？\u003cbr>\u003cstrong>A\u003c/strong>：目前靠人工看回放。这是缺口——没有评估集，模板改动只能凭感觉，所以我把评测列为下一步。\u003c/li>\u003c/ul>","questions":["快照会不会太大？","怎么对比两个模板的效果？"]},{"id":"llm-02","title":"上下文太长怎么处理","stage":"llm","week":"","file":"cards/04-面试/04-大模型/02-上下文太长.md","filled":true,"hasNumbers":true,"short":"\u003cp>三件事。建连时按模板裁剪简历和岗位，只留当前面试相关的部分；会话消息作为输入队列按序回灌，不是每次全量重发；用户本人的语音单独存表、不混进队列，否则模型会回答自己刚被念过的内容。\u003c/p>","expand":"\u003cul>\u003cli>裁剪依据：模板定义哪些字段相关，不相关的不进上下文\u003c/li>\u003cli>队列回灌的意义：把「上下文」变成可控的增量，而不是每次都把全部历史拼一遍\u003c/li>\u003cli>污染治理最典型：面试官念出候选人原文，模型会误以为是自己的话\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：裁剪规则谁定？\u003cbr>\u003cstrong>A\u003c/strong>：模板里配。同一个岗位的面试模板固定，裁什么就固定，不靠模型临场判断。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：队列满了怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：超长时按优先级丢弃最早的低价值消息，但必须保留最近几轮和所有约束类消息。\u003c/li>\u003c/ul>","questions":["裁剪规则谁定？","队列满了怎么办？"]},{"id":"llm-03","title":"做过 Agent 吗","stage":"llm","week":"","file":"cards/04-面试/04-大模型/03-做过Agent吗.md","filled":true,"hasNumbers":true,"short":"\u003cp>没有，这是明确的空白，不编。相关的是工具调用式的设计——按任务路由到不同模型或服务——但没做过模型自主决定调哪个工具的闭环。\u003c/p>","expand":"\u003cul>\u003cli>分清两件事：人决定调哪个服务（我这半年做的），模型自己决定调哪个工具（没做过）\u003c/li>\u003cli>我知道的边界：ReAct 循环、工具描述设计、失败重试与终止条件，能讲原理，没跑过生产\u003c/li>\u003cli>补齐路径：MCP Server 一天能做完，先有个可演示的东西\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：那你怎么理解 ReAct？\u003cbr>\u003cstrong>A\u003c/strong>：推理 → 调工具 → 观测 → 再推理，靠终止条件收口。难点不在循环，在工具描述和失败处理——描述错了模型就调错。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：多久能上手？\u003cbr>\u003cstrong>A\u003c/strong>：我做过完整的任务路由和降级，缺的是让模型自己决策这一步。给两三周能做出能演示的闭环，做稳要更久。\u003c/li>\u003c/ul>","questions":["那你怎么理解 ReAct？","多久能上手？"]},{"id":"llm-04","title":"幻觉怎么抑制","stage":"llm","week":"","file":"cards/04-面试/04-大模型/04-幻觉抑制.md","filled":true,"hasNumbers":true,"short":"\u003cp>三层。Schema 把字段和枚举限死；prompt 明确「未知就留空」，而不是让它猜；关键信息不让模型生成，走规则或查库。\u003c/p>","expand":"\u003cul>\u003cli>三层的作用面不同：Schema 管形状，prompt 管态度，规则管事实\u003c/li>\u003cli>「未知就留空」为什么要写进 prompt：默认行为是补全，不写就会被编得很像真的\u003c/li>\u003cli>没做的：量化幻觉率，没有评估集就没有数字\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：留空和编造哪个更糟？\u003cbr>\u003cstrong>A\u003c/strong>：编造更糟。留空用户知道没填，编造会让用户信错的。所以宁可空。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：怎么验证有效？\u003cbr>\u003cstrong>A\u003c/strong>：目前只能抽查回放。要做量化就得有标注集，这是我在补的下一件事。\u003c/li>\u003c/ul>","questions":["留空和编造哪个更糟？","怎么验证有效？"]},{"id":"llm-05","title":"模型怎么选型","stage":"llm","week":"","file":"cards/04-面试/04-大模型/05-模型选型.md","filled":true,"hasNumbers":true,"short":"\u003cp>按任务选：结构化抽取要稳定，选指令跟随好的；实时对话要低延迟，选小的或本地部署。按合规，敏感数据走 vLLM 本地不出内网；按成本，能规则解决的不调模型。\u003c/p>","expand":"\u003cul>\u003cli>三个维度排序：先合规（能不能用），再任务（稳不稳），最后成本\u003c/li>\u003cli>本地部署的代价：显存、运维、效果可能弱于云端，换的是数据不出网\u003c/li>\u003cli>换模型要重调 prompt 吗：要，指令风格不同，约束写法要跟着变\u003c/li>\u003c/ul>","followup":"\u003cul>\u003cli>\u003cstrong>Q\u003c/strong>：怎么对比两个模型？\u003cbr>\u003cstrong>A\u003c/strong>：同一批样本跑一遍看通过率和耗时。没有评估集就靠抽样，这不算严谨，只能说比拍脑袋好。\u003c/li>\u003cli>\u003cstrong>Q\u003c/strong>：本地模型效果差很多怎么办？\u003cbr>\u003cstrong>A\u003c/strong>：结构化抽取这类任务，靠 Schema 约束和少量样本就能拉起来；生成类任务确实弱，那就只在必须不出网的场景用。\u003c/li>\u003c/ul>","questions":["怎么对比两个模型？","本地模型效果差很多怎么办？"]}]</script>
<script type="application/json" id="initial-state">{}</script>
<script>
/* 学习训练场 · 复习界面 */
;(function () {
  'use strict'

  var CARDS = JSON.parse(document.getElementById('cards-data').textContent)
  var INITIAL_STATE = JSON.parse(document.getElementById('initial-state').textContent)
  var KEY = 'llm-learning-state-v1'
  var THEME_KEY = 'llm-theme'

  // ── 日期 ────────────────────────────────────────────
  function pad(n) {
    return n < 10 ? '0' + n : '' + n
  }
  function fmt(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  }
  function todayStr() {
    return fmt(new Date())
  }
  function addDays(n) {
    var d = new Date()
    d.setDate(d.getDate() + n)
    return fmt(d)
  }

  // ── 状态 ────────────────────────────────────────────
  var state = (function () {
    try {
      var raw = localStorage.getItem(KEY)
      if (raw) return JSON.parse(raw)
    } catch (e) {}
    return JSON.parse(JSON.stringify(INITIAL_STATE))
  })()

  function saveState() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state))
    } catch (e) {}
  }

  function nextInterval(level, prev) {
    var streak = (prev && prev.streak) || 0
    if (level === 1) return { days: 1, streak: 0 }
    if (level === 2) return { days: 3, streak: 0 }
    var s = streak + 1
    return { days: s >= 3 ? 21 : 7, streak: s }
  }

  var today = todayStr()

  function filledCards() {
    return CARDS.filter(function (c) {
      return c.filled
    })
  }

  function dueList() {
    return filledCards()
      .filter(function (c) {
        var s = state[c.id]
        return !s || !s.due || s.due <= today
      })
      .sort(function (a, b) {
        var da = (state[a.id] && state[a.id].due) || '0000'
        var db = (state[b.id] && state[b.id].due) || '0000'
        return da < db ? -1 : da > db ? 1 : 0
      })
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  var STAGE = {
    rag: { short: 'RAG', full: '阶段一 · RAG' },
    agent: { short: 'Agent', full: '阶段二 · Agent' },
    eval: { short: '评测', full: '阶段三 · 评测' },
    fe: { short: '前端', full: '面试口播 · 前端' },
    java: { short: 'Java', full: '面试口播 · Java 后端' },
    ai: { short: 'AI 应用', full: '面试口播 · AI 应用' },
    llm: { short: '大模型', full: '面试口播 · 大模型' },
  }
  function stageShort(s) {
    return (STAGE[s] && STAGE[s].short) || s
  }
  function stageFull(s) {
    return (STAGE[s] && STAGE[s].full) || s
  }

  // ── 会话 ────────────────────────────────────────────
  var session = null // { cards: [], pos: 0, scores: [] }
  var flipped = false
  var view = 'review'
  var filter = 'all'
  var keyword = ''

  function startSession(cards) {
    session = { cards: cards, pos: 0, scores: [] }
    flipped = false
    showView('review')
    renderReview()
  }

  function showView(v) {
    view = v
    document.querySelectorAll('.view').forEach(function (el) {
      el.classList.toggle('active', el.dataset.view === v)
    })
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('on', b.dataset.goto === v)
    })
    if (v === 'all') renderList()
    if (v === 'review') renderReview()
    window.scrollTo({ top: 0 })
  }

  // ── 顶栏统计 ────────────────────────────────────────
  function renderStats() {
    var f = filledCards().length
    var d = dueList().length
    document.getElementById('stat-filled').innerHTML = '<b>' + f + '</b>/' + CARDS.length
    document.getElementById('stat-due').innerHTML = '今日到期 <b>' + d + '</b>'
    document.getElementById('progress-bar').style.width =
      (CARDS.length ? (f / CARDS.length) * 100 : 0) + '%'
  }

  // ── 复习视图 ────────────────────────────────────────
  function renderReview() {
    var el = document.getElementById('review-body')
    renderStats()

    if (!session) {
      var due = dueList()
      if (!due.length) {
        el.innerHTML = emptyDone()
        return
      }
      // 默认进来到期队列
      session = { cards: due, pos: 0, scores: [] }
    }

    if (session.pos >= session.cards.length) {
      el.innerHTML = sessionDone()
      return
    }

    var c = session.cards[session.pos]
    var s = state[c.id]
    var total = session.cards.length
    var num = session.pos + 1
    var head =
      '<div class="card-head">' +
      '<div class="tag"><em>' +
      stageShort(c.stage) +
      '</em>' +
      (c.week ? '第 ' + esc(c.week) + ' 周' : '') +
      '</div>' +
      (total > 1 ? '<div class="counter">' + num + ' / ' + total + '</div>' : '') +
      '</div>'

    // 未填的卡片：只给问题，不给答案
    if (!c.filled) {
      var qs = (c.questions || [])
        .map(function (q) {
          return '<li>' + esc(q) + '</li>'
        })
        .join('')
      el.innerHTML =
        '<div class="card preview">' +
        head +
        '<h1>' +
        esc(c.title) +
        '</h1>' +
        '<div class="notice">这张还没填「30 秒版」' +
        '<br><span>答案得自己写，写不出来说明还没懂。照着下面几个问题答一遍，就是这张卡的内容。</span></div>' +
        (qs
          ? '<div class="followup"><div class="answer-head">面试官会这么问</div>' +
            '<div class="prose"><ul class="qs">' +
            qs +
            '</ul></div></div>'
          : '') +
        '<div class="actions"><button class="btn" id="btn-back">返回列表</button></div>' +
        '</div>' +
        '<div class="footnote">' +
        esc(c.file) +
        '</div>'
      return
    }

    var backExtra = ''

    // 展开：默认收起，想细看再点开
    if (c.expand) {
      backExtra +=
        '<details class="deep">' +
        '<summary>展开' +
        '<span class="hint-closed"> · 想细看再点开</span>' +
        '<span class="hint-open"> · 点收起</span>' +
        '</summary>' +
        '<div class="prose">' +
        c.expand +
        '</div></details>'
    }

    if (c.followup) {
      backExtra +=
        '<div class="followup">' +
        '<div class="answer-head">追问预演</div>' +
        '<div class="prose">' +
        c.followup +
        '</div></div>'
    }

    el.innerHTML =
      '<div class="card' +
      (flipped ? ' flipped' : '') +
      '" id="card" tabindex="0" role="button">' +
      '<div class="face-front">' +
      head +
      '<h1>' +
      esc(c.title) +
      '</h1>' +
      '<div class="hint">先在心里答一遍，再翻开　<kbd>空格</kbd></div>' +
      '</div>' +
      '<div class="face-back">' +
      '<div class="answer-head">30 秒版</div>' +
      '<div class="prose">' +
      (c.short || '<p>（还没写）</p>') +
      '</div>' +
      backExtra +
      '<div class="actions">' +
      '<button data-score="1"><b>1</b> 没答上</button>' +
      '<button data-score="2"><b>2</b> 说清了</button>' +
      '<button data-score="3"><b>3</b> 能扛追问</button>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '<div class="footnote">' +
      esc(c.file) +
      (s && s.lastReview ? '　上次复习 ' + esc(s.lastReview) : '') +
      '</div>'
  }

  function emptyDone() {
    var todo = CARDS.filter(function (c) {
      return !c.filled
    }).length
    return (
      '<div class="empty">' +
      '<div class="big">今天没有到期的卡</div>' +
      '<p>' +
      (filledCards().length
        ? '间隔重复的休息日也是学习的一部分。想加练可以随机抽一张。'
        : '还没有填完的卡片。先去写一张——只填「30 秒版」那一段就够。') +
      '</p>' +
      '<div class="empty-actions">' +
      (filledCards().length
        ? '<button class="btn primary" id="btn-random">随机抽一张</button>'
        : '') +
      '<button class="btn" id="btn-all">看全部卡片' + (todo ? '（' + todo + ' 张待填）' : '') + '</button>' +
      '</div></div>'
    )
  }

  function sessionDone() {
    var n = session.scores.length
    var sum = session.scores.reduce(function (a, b) {
      return a + b
    }, 0)
    var avg = n ? (sum / n).toFixed(1) : '0'
    var weak = session.scores.filter(function (x) {
      return x === 1
    }).length
    var rest = dueList().length

    return (
      '<div class="empty">' +
      '<div class="big">这一轮结束了</div>' +
      '<p>复习 ' +
      n +
      ' 张，平均 ' +
      avg +
      ' 分' +
      (weak ? '，其中 ' + weak + ' 张没答上' : '，全部答上') +
      (rest ? '。还有 ' + rest + ' 张到期。' : '。') +
      '</p>' +
      '<div class="empty-actions">' +
      (rest ? '<button class="btn primary" id="btn-more">再来一轮</button>' : '') +
      '<button class="btn" id="btn-all">看全部卡片</button>' +
      '</div></div>'
    )
  }

  function flip() {
    if (!session || session.pos >= session.cards.length) return
    var cur = session.cards[session.pos]
    if (!cur || !cur.filled) return
    flipped = !flipped
    var card = document.getElementById('card')
    if (card) card.classList.toggle('flipped', flipped)
    if (flipped) {
      setTimeout(function () {
        var el = document.getElementById('card')
        if (!el) return
        var top = el.getBoundingClientRect().top + window.scrollY - 72
        if (top < window.scrollY) window.scrollTo({ top: top, behavior: 'smooth' })
      }, 10)
    }
  }

  function score(level) {
    if (!session || session.pos >= session.cards.length) return
    var c = session.cards[session.pos]
    if (!c || !c.filled) return
    var prev = state[c.id]
    var r = nextInterval(level, prev)

    state[c.id] = {
      due: addDays(r.days),
      level: level,
      streak: r.streak,
      times: ((prev && prev.times) || 0) + 1,
      lastReview: today,
    }
    saveState()

    session.scores.push(level)
    session.pos++
    flipped = false
    renderReview()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }

  // ── 全部卡片 ────────────────────────────────────────
  function statusOf(c) {
    if (!c.filled) return { cls: 'todo', label: '待填' }
    var s = state[c.id]
    if (!s || !s.due) return { cls: 'fresh', label: '未复习' }
    if (s.due <= today) return { cls: 'due', label: '到期' }
    return { cls: 'ok', label: s.due }
  }

  function renderList() {
    var el = document.getElementById('list')
    var kw = keyword.trim().toLowerCase()

    var items = CARDS.filter(function (c) {
      if (kw && (c.title + ' ' + c.id).toLowerCase().indexOf(kw) < 0) return false
      if (filter === 'due') {
        var s = state[c.id]
        return c.filled && (!s || !s.due || s.due <= today)
      }
      if (filter === 'todo') return !c.filled
      return true
    })

    if (!items.length) {
      el.innerHTML = '<div class="empty"><p>没有匹配的卡片</p></div>'
      return
    }

    var groups = {}
    var order = []
    items.forEach(function (c) {
      if (!groups[c.stage]) {
        groups[c.stage] = []
        order.push(c.stage)
      }
      groups[c.stage].push(c)
    })

    var html = ''
    order.forEach(function (st) {
      html += '<div class="group-title">' + esc(stageFull(st)) + '</div><div class="list">'
      groups[st].forEach(function (c) {
        var stt = statusOf(c)
        var pill = c.filled
          ? c.hasNumbers
            ? '<span class="pill num">有数字</span>'
            : '<span class="pill nonum">缺数字</span>'
          : ''
        html +=
          '<div class="item' +
          (c.filled ? '' : ' todo') +
          '" data-id="' +
          esc(c.id) +
          '">' +
          '<span class="dot ' +
          stt.cls +
          '"></span>' +
          '<div class="item-body">' +
          '<div class="item-title">' +
          esc(c.title) +
          '</div>' +
          '<div class="item-meta"><span>' +
          esc(c.id) +
          '</span><span>' +
          esc(stt.label) +
          '</span></div>' +
          '</div>' +
          pill +
          '</div>'
      })
      html += '</div>'
    })

    el.innerHTML = html
  }

  // ── 事件 ────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var t = e.target

    // 自评
    var sc = t.closest('[data-score]')
    if (sc) {
      e.stopPropagation()
      score(Number(sc.dataset.score))
      return
    }

    // 卡片翻面
    var card = t.closest('#card')
    if (card) {
      if (!flipped) flip()
      return
    }

    // 列表项
    var item = t.closest('.item')
    if (item) {
      var c = CARDS.find(function (x) {
        return x.id === item.dataset.id
      })
      if (c) startSession([c])
      return
    }

    if (t.closest('#btn-back')) return showView('all')

    // 按钮
    if (t.closest('#btn-random')) {
      var f = filledCards()
      if (f.length) startSession([f[Math.floor(Math.random() * f.length)]])
      return
    }
    if (t.closest('#btn-all')) return showView('all')
    if (t.closest('#btn-more')) return startSession(dueList())

    var tab = t.closest('.tab')
    if (tab) {
      session = null
      return showView(tab.dataset.goto)
    }

    var seg = t.closest('[data-filter]')
    if (seg) {
      filter = seg.dataset.filter
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.filter === filter)
      })
      renderList()
      return
    }

    if (t.closest('#btn-theme')) {
      var cur = document.documentElement.getAttribute('data-theme')
      if (!cur) {
        cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      var next = cur === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
      try {
        localStorage.setItem(THEME_KEY, next)
      } catch (err) {}
      return
    }

    if (t.closest('#btn-export')) {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })
      var a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = 'review-state.json'
      a.click()
      return
    }

    if (t.closest('#btn-import')) {
      document.getElementById('file-input').click()
      return
    }

    if (t.closest('#btn-reset')) {
      if (confirm('清空所有复习记录？这个操作不可撤销。')) {
        state = {}
        saveState()
        session = null
        renderReview()
        renderList()
      }
      return
    }
  })

  document.addEventListener('input', function (e) {
    if (e.target.id === 'search-input') {
      keyword = e.target.value
      renderList()
    }
  })

  document.getElementById('file-input').addEventListener('change', function (e) {
    var file = e.target.files[0]
    if (!file) return
    var reader = new FileReader()
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result)
        state = data
        saveState()
        session = null
        renderReview()
        renderList()
        alert('已导入 ' + Object.keys(data).length + ' 条复习记录。')
      } catch (err) {
        alert('文件格式不对，需要 review-state.json。')
      }
    }
    reader.readAsText(file)
    e.target.value = ''
  })

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return
    // 焦点在「展开」的 summary 上时，把空格/回车让给折叠，别抢去翻面
    if (e.target.closest && e.target.closest('summary')) return
    if (view !== 'review' || !session) return

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault()
      if (!flipped) flip()
    } else if (flipped && (e.key === '1' || e.key === '2' || e.key === '3')) {
      e.preventDefault()
      score(Number(e.key))
    }
  })

  // ── 初始化 ──────────────────────────────────────────
  try {
    var th = localStorage.getItem(THEME_KEY)
    if (th) document.documentElement.setAttribute('data-theme', th)
  } catch (e) {}

  renderStats()
  showView('review')
})()

</script>
</body>
</html>
